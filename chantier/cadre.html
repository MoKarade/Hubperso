<!doctype html>
<html lang="fr">
<head>
<script>/* Chantier dans le hub : cette page tourne dans un cadre à origine OPAQUE (iframe `sandbox`, sans
   `allow-same-origin`) : elle n'a ni cookie du hub, ni accès à ses pages, ni réseau (`connect-src 'none'`).
   Le hub (la page parente, composant `ChantierCadre`) lit le relevé avec la session du propriétaire et le lui
   POSTE ; ce shim le rend à la page par la même interface que l'artefact (`window.claude.use('files')`).
   Le relevé ne passe JAMAIS par un `postMessage` à destinataire « * » : la page crée un canal (MessageChannel),
   remet l'un de ses bouts au hub — en nommant son origine, celle de l'adresse de CE document —, et le hub
   n'écrit plus que dans ce canal, qui n'a qu'un destinataire. */
(function () {
  var octets = null, attente = [], recu = false, canalHub = null, portHub = null, gestes = {};
  function etat(texte) {
    var e = document.getElementById('err');
    if (e) { e.hidden = !texte; e.textContent = texte || ''; }
    else if (texte) document.addEventListener('DOMContentLoaded', function () { etat(texte); }, { once: true });
  }
  function surCanal(ev) {
    var m = ev.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'chantier-ok') {
      recu = true;
      portHub = ev.target;
      // Le hub sait déposer les gestes de l'onglet « À toi » (à la place du dossier Drive, que ce cadre n'a pas).
      if (m.gestes === true) {
        canalHub = ev.target;
        window.hubGestes = true;
        if (typeof window.surGestes === 'function') window.surGestes();
      }
    } else if (m.type === 'chantier-geste' && typeof m.id === 'string' && gestes[m.id]) {
      var g = gestes[m.id]; delete gestes[m.id]; clearTimeout(g.t);
      if (m.ok === true) g.ok(); else g.ko(new Error(typeof m.erreur === 'string' && m.erreur ? m.erreur : 'refusé'));
    } else if (m.type === 'chantier-releve' && m.octets instanceof ArrayBuffer) {
      recu = true;
      octets = new Uint8Array(m.octets);
      etat('');
      attente.splice(0).forEach(function (r) { r({ bytes: octets }); });
      // un relevé neuf se lit tout de suite, sans attendre le prochain tour de la minute
      if (typeof window.surReleve === 'function') window.surReleve();
    } else if (m.type === 'chantier-version-neuve') {
      // Le hub voit un document neuf (un déploiement) : la page décide quand se recharger (plus personne ne s'en sert).
      if (typeof window.surVersionNeuve === 'function') window.surVersionNeuve();
    } else if (m.type === 'chantier-evenements') {
      // Les événements GitHub reçus par le hub (webhooks signés) : l'état à l'instant, avant le relevé du PC.
      recu = true;
      if (typeof window.surEvenements === 'function') window.surEvenements(m); else (window.evEnAttente = window.evEnAttente || []).push(m);
    } else if (m.type === 'chantier-rattrapage') {
      // Ce que GitHub dit de l'état courant des issues et PR, lu une fois par le hub à l'ouverture (le trou entre le relevé du PC et les événements).
      recu = true;
      if (typeof window.surRattrapage === 'function') window.surRattrapage(m); else (window.ratEnAttente = window.ratEnAttente || []).push(m);
    } else if (m.type === 'chantier-couts') {
      // Les coûts et quotas des apps (la page Coûts du hub, reprise ici) : lus par le hub, jamais par ce document.
      recu = true;
      window.hubCouts = m.couts && typeof m.couts === 'object' ? m.couts : null;
      window.hubCoutsAt = window.hubCouts ? Date.now() : NaN;
      window.hubCoutsErreur = typeof m.erreur === 'string' ? m.erreur : '';
      if (typeof window.surCouts === 'function') window.surCouts();
    } else if (m.type === 'chantier-etat') {
      recu = true;
      etat(typeof m.message === 'string' ? m.message : '');
    } else if (m.type === 'chantier-onglet' && typeof m.onglet === 'string') {
      // Le cadre reste ouvert d'une page du hub à l'autre : `/chantier?onglet=couts` lui demande l'onglet, sans le recharger.
      if (typeof window.surOnglet === 'function') window.surOnglet(m.onglet);
    }
  }
  // Le hub peut écouter APRÈS notre premier appel (l'hydratation vient après le document) : on se
  // représente chaque seconde, avec un canal neuf (un bout ne se transfère qu'une fois), jusqu'à son « ok ».
  function bonjour() {
    if (recu || window.parent === window) return;
    var canal = new MessageChannel();
    canal.port1.onmessage = surCanal;
    window.parent.postMessage({ type: 'chantier-pret' }, new URL(location.href).origin, [canal.port2]);
  }
  // Un geste (Fusionner, Fait, une réponse) : le hub le dépose avec la session du propriétaire ; ce cadre n'a ni réseau ni Drive.
  window.hubGestes = false;
  window.hubGeste = function (corps) {
    return new Promise(function (ok, ko) {
      if (!canalHub) return ko(new Error('Le hub ne répond pas.'));
      var t = setTimeout(function () { delete gestes[corps.id]; ko(new Error('Le hub ne répond pas.')); }, 15000);
      gestes[corps.id] = { ok: ok, ko: ko, t: t };
      canalHub.postMessage({ type: 'chantier-geste', geste: corps });
    });
  };
  // Se recharger : le hub est prévenu d'abord (il accepte alors le canal du document neuf), l'onglet reste dans l'adresse (#onglet).
  window.hubRecharger = function () {
    if (!portHub) return false;
    portHub.postMessage({ type: 'chantier-recharge' });
    setTimeout(function () { location.reload(); }, 150);
    return true;
  };
  // Clic droit (ou appui long) : le hub ne voit pas ce qui se passe dans ce cadre, il reçoit donc `{type, x, y, genre, texte}`
  // par le canal. Faux tant qu'aucun hub n'écoute : le menu du navigateur reste alors en place.
  window.hubClicDroit = function (msg) {
    if (!portHub) return false;
    portHub.postMessage(msg);
    return true;
  };
  window.claude = {
    use: function (nom) {
      // Seules les données du relevé sont servies ; le connecteur Drive et la base de l'artefact n'existent pas ici.
      if (nom !== 'files') return Promise.reject({ code: 'not_granted' });
      return Promise.resolve({
        read: function () {
          return octets ? Promise.resolve({ bytes: octets }) : new Promise(function (r) { attente.push(r); });
        }
      });
    }
  };
  bonjour();
  var minuteur = setInterval(function () { if (recu) clearInterval(minuteur); else bonjour(); }, 1000);
})();
</script>

<title>Chantier Apps</title>
<style>
:root{
  --bg:#f3f4f6;--panel:#ffffff;--panel2:#f8f9fb;--ink:#14171c;--mute:#5f6773;--line:#e2e5ea;
  --done:#1f9a6b;--doing:#2f6fd6;--todo:#8a93a1;--marc:#d9770b;--now:#d93a3a;--focus:#2f6fd6;--fus:#f2b866;--fus-t:#a45500;--blk:#ec9a95;--blk-t:#c0392b;
  --c-ch:#e3e8ff;--c-ch-t:#2c3a8c;--c-mi:#dcf3ec;--c-mi-t:#17694f;--c-ta:#ffffff;--c-ta-t:#5f6773;--sel:#dbe6ff;--sel-t:#1d3f8f;
  --a-eco:#14171c;--a-fin:#1f9a6b;--a-job:#2f6fd6;--a-batch:#e0661c;--a-drive:#1f7fb0;--a-hub:#c23a3a;
  --a-car:#a8870a;--a-mem:#a8478f;--a-tpl:#5c6574;--a-hc:#4f5fd0;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fm:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--panel:#181b21;--panel2:#1e222a;--ink:#eef0f3;--mute:#9aa3b0;--line:#2a2f38;
  --done:#3fb68b;--doing:#5b8def;--todo:#8a8f98;--marc:#e3a23b;--now:#e5675b;--focus:#6ea2ff;--fus:#9a6420;--fus-t:#ffb866;--blk:#9a4a46;--blk-t:#ff8f86;
  --c-ch:#2a3157;--c-ch-t:#c8d0ff;--c-mi:#1b3a32;--c-mi-t:#a6e3cf;--c-ta:#181b21;--c-ta-t:#9aa3b0;--sel:#2a3a5e;--sel-t:#d6e2ff;
  --a-eco:#eef0f3;--a-fin:#3cc48e;--a-job:#6ea2ff;--a-batch:#ff8a45;--a-drive:#58b8e8;--a-hub:#ff6b6b;
  --a-car:#e8c547;--a-mem:#d77fc0;--a-tpl:#a0a8b4;--a-hc:#8fa0ff;color-scheme:dark;
}}
:root,:root[data-theme="dark"]{
  --bg:#0f1115;--panel:#181b21;--panel2:#1e222a;--ink:#eef0f3;--mute:#9aa3b0;--line:#2a2f38;
  --done:#3fb68b;--doing:#5b8def;--todo:#8a8f98;--marc:#e3a23b;--now:#e5675b;--focus:#6ea2ff;--fus:#9a6420;--fus-t:#ffb866;--blk:#9a4a46;--blk-t:#ff8f86;
  --c-ch:#2a3157;--c-ch-t:#c8d0ff;--c-mi:#1b3a32;--c-mi-t:#a6e3cf;--c-ta:#181b21;--c-ta-t:#9aa3b0;--sel:#2a3a5e;--sel-t:#d6e2ff;
  --a-eco:#eef0f3;--a-fin:#3cc48e;--a-job:#6ea2ff;--a-batch:#ff8a45;--a-drive:#58b8e8;--a-hub:#ff6b6b;
  --a-car:#e8c547;--a-mem:#d77fc0;--a-tpl:#a0a8b4;--a-hc:#8fa0ff;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f);-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:2200px;margin:0 auto;padding:16px var(--gut,16px) 64px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
h1{font-size:22px;line-height:1.15;margin:0;letter-spacing:-.01em}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.bar{position:sticky;top:0;z-index:10;background:var(--bg);margin:0 calc(var(--gut,16px) * -1) 10px;padding:8px var(--gut,16px);border-bottom:1px solid var(--line)}
.barrow{display:flex;align-items:center;gap:8px}
.lien-gh{display:inline-flex;align-items:center;margin-top:4px;color:var(--ink);text-decoration:none}
.ib{flex:none;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-weight:600;font-size:14px;white-space:nowrap}
.jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;font-weight:600;white-space:nowrap}
.jump .dot{width:9px;height:9px}
.app,.grow.l-app{scroll-margin-top:118px}
.haut{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:15;width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:20px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font:600 12.5px var(--fm);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--done);flex:none}
.pill.ko i,.pill.old i{background:var(--now)}
.pill.old{color:var(--now)}
.pill.nd i{background:var(--todo)}
button.pill{cursor:pointer}
.hist{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px}
.hist i{width:9px;height:16px;border-radius:2px;background:var(--done)}
.hist i.x{background:var(--now)}
.hist i.n{background:var(--todo)}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.bar3{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line);gap:2px}
.bar3 span{display:block;height:100%}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.nums div{min-width:0}
.nums b{display:block;font:700 20px/1.1 var(--fm)}
.nums small{color:var(--mute);font-size:12px;white-space:nowrap}
@media (max-width:400px){.nums b{font-size:17px}.nums small{font-size:11px}}
.k-done{color:var(--done)}.k-fus{color:var(--fus-t)}.k-ret{color:var(--blk-t)}.k-doing{color:var(--doing)}.k-todo{color:var(--todo)}.k-marc{color:var(--marc)}
.qv{display:flex;flex-direction:column;gap:12px}
.qg{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.qg h3{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.qg .v{font:600 12.5px var(--fm);padding:3px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.qg .v.ok{color:var(--done);border-color:var(--done)}.qg .v.vig{color:var(--marc);border-color:var(--marc)}.qg .v.ko{color:var(--now);border-color:var(--now)}.qg .v.nd{color:var(--mute)}
.qbig{font:700 26px var(--fm);line-height:1.1}.qbig small{font:500 13px var(--f);color:var(--mute)}
.qbar{position:relative;height:12px;border-radius:99px;background:var(--line);overflow:visible}
.qbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--doing);max-width:100%}
.qbar.ok>i{background:var(--done)}.qbar.vig>i{background:var(--marc)}.qbar.ko>i{background:var(--now)}
.qbar>u{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:2px;text-decoration:none}
.qleg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.qrows{display:grid;grid-template-columns:1fr;gap:6px;font-size:14px}
.qrows div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.qrows b{font-family:var(--fm);font-weight:600;text-align:right}
.qd{display:flex;align-items:flex-end;gap:4px;height:48px}
.qd span{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%;font:10px var(--fm);color:var(--mute)}
.qd span i{display:block;width:100%;background:var(--doing);border-radius:3px 3px 0 0;min-height:2px}
.qd span.bad i{background:var(--now)}
.qnote{font-size:12.5px;color:var(--mute);margin:0}
.qal{background:color-mix(in srgb,var(--marc) 12%,var(--panel));border:1px solid var(--marc);border-radius:12px;padding:8px 10px;font-size:13px}
.qin{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qin input{min-height:44px;font-size:16px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink);max-width:100%}
.qin input[type=number]{width:92px}
.qin label{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;max-width:100%}.qin input[type=datetime-local]{width:100%;min-width:0}
.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{min-height:36px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-t)}
.seg button b{font:700 11px var(--fm);color:var(--marc);margin-left:4px}
.seg button[aria-pressed="true"] b{color:inherit}
.ctrl{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mute);font-size:12.5px;margin:2px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.note{color:var(--mute);font-size:13px;margin:0 0 10px}
.err{background:color-mix(in srgb,var(--now) 12%,var(--panel));border:1px solid var(--now);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.warnb{background:color-mix(in srgb,var(--blk) 18%,var(--panel));border:1px solid var(--blk-t);color:var(--ink);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:13.5px;line-height:1.4}
.ico{width:18px;height:18px;flex:none;display:block}
/* niveaux */
.lvl{display:inline-flex;align-items:center;justify-content:center;flex:none;min-width:64px;height:20px;padding:0 6px;border-radius:6px;font:700 10px var(--fm);letter-spacing:.05em;text-transform:uppercase;border:1px solid transparent}
.lvl-chantier{background:var(--c-ch);color:var(--c-ch-t)}
.lvl-mission{background:var(--c-mi);color:var(--c-mi-t)}
.lvl-tâche{background:var(--c-ta);color:var(--c-ta-t);border-color:var(--line)}
.lvl-app{background:color-mix(in srgb,var(--ac,var(--ink)) 16%,var(--panel));color:var(--ink);border-color:color-mix(in srgb,var(--ac,var(--ink)) 35%,transparent)}
.lvl.big{height:26px;font-size:12px;min-width:84px;padding:0 10px}
/* plan */
.app{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.ahd{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 8px;min-height:52px}
.ahd .rb{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ac);flex:none}
.aname{font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.prog{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
.prog .bar3{width:72px;height:8px}
.prog em{font:600 12px var(--fm);color:var(--mute);font-style:normal;min-width:44px;text-align:right}
.st-done,.e-acc{--sc:var(--done)}.st-doing,.e-cours,.e-rel{--sc:var(--doing)}.st-todo,.e-todo,.e-aband{--sc:var(--todo)}
.e-fus,.e-prog{--sc:var(--fus);--st:var(--fus-t)}.bar3 .e-prog,.gw2.e-prog,.gl2.e-prog{background:repeating-linear-gradient(135deg,var(--fus) 0 5px,color-mix(in srgb,var(--fus) 40%,transparent) 5px 10px)}
.e-ret{--sc:var(--blk);--st:var(--blk-t)}.e-marc{--sc:var(--marc)}.e-blk{--sc:var(--blk);--st:var(--blk-t)}
.oubli{--sc:var(--vio);--st:var(--vio)}
.et-cours{--sc:var(--doing)}.et-marc{--sc:var(--marc)}.et-blk{--sc:var(--blk)}.et-preuve{--sc:var(--fus)}.et-corr{--sc:var(--vio)}.et-pause,.et-file{--sc:var(--todo)}.et-faite{--sc:var(--done)}.et-acc{--sc:var(--done)}.et-aband{--sc:var(--todo)}.et-pm{--sc:var(--now)}
.etb i.borne{flex:none;width:10px;min-width:10px;border-radius:0 5px 5px 0}.et-faite.borne{--sc:var(--now)}
.etb{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:4px 0 8px;gap:1px}.etb i{display:block;min-width:3px;background:var(--sc)}
.ets{display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:6px}.ets span,.etl{display:flex;align-items:center;gap:6px}
.ets i,.etl i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--sc);flex:none}
.etl{font-size:13px;padding:3px 0;border-top:1px solid var(--line)}.etl span:first-of-type{color:var(--mute);min-width:9.5em}.etl b{margin-left:auto;font:600 12.5px var(--fm)}
/* l'état d'une barre au fil du temps (Marc, 28/10) : pleine couleur, et une borne à la fin d'une tâche ou d'une mission fermée */
.gl2[class*=" et-"]{height:12px;margin-top:-6px;background:var(--sc)}
.gl2.borne{min-width:9px;border-radius:0 5px 5px 0}
/* Ressources : une ligne par quota (Marc, 28/10) */
.qlist{display:grid;max-width:760px}
.qrow{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) 4.2em;grid-template-areas:"n b v" "p p p";gap:2px 14px;align-items:center;width:100%;min-height:44px;padding:12px 0 10px;box-shadow:0 -1px 0 var(--line);text-align:left}
.qrow:first-child{box-shadow:none}
.qrow .n{grid-area:n;font-weight:650;font-size:15px}
.qrow .qbar{grid-area:b;grid-column:2;grid-row:1;position:relative;height:10px;border-radius:5px;background:var(--line2);overflow:visible}
.qrow .qbar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--qc)}
.qrow .qbar u{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);opacity:.75;text-decoration:none}
.qrow .v{grid-area:v;text-align:right;font:700 18px var(--fd)}
.qrow .p{grid-area:p;font-size:13px;color:var(--mute)}
.qrow .qdp{color:var(--ink);font-weight:700}
.qv-ok{--qc:var(--done)}.qv-vig{--qc:var(--marc)}.qv-ko{--qc:var(--now)}.qv-nd{--qc:var(--todo)}.qv-act{--qc:var(--a-mem)}

.gfin{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:4px;background:var(--done);box-shadow:0 0 0 2px var(--bg)}
.gfin::after{content:"";position:absolute;left:4.5px;top:2px;width:4px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

.row{display:flex;align-items:center;gap:6px;min-height:54px;padding:0 10px 0 calc(8px + var(--d,0) * 14px);border-top:1px solid var(--line);box-shadow:inset 4px 0 0 var(--sc,var(--todo));background:color-mix(in srgb,var(--sc) 7%,transparent)}
.row.st-todo,.row.e-todo,.row.e-aband{box-shadow:inset 4px 0 0 color-mix(in srgb,var(--todo) 40%,transparent);background:none}

.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding:6px 0}
.mt{font:600 12.5px var(--f);color:var(--mute);overflow-wrap:anywhere}
.mt.c,.cf.c,.gd.c{color:var(--st,var(--sc))}.mt.hot,.cf.hot{color:var(--now)}
.chev{width:32px;height:44px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--mute)}

.rb{display:flex;align-items:center;gap:8px;flex:1;min-width:0;min-height:44px}

.row.st-done .tt,.row.e-acc .tt,.row.e-aband .tt{color:var(--mute)}
.rt{flex:none;display:flex;align-items:center;gap:6px;font:600 12px var(--fm);color:var(--mute)}
/* cartes */
.grp{padding:4px 12px 14px;border-top:1px solid var(--line)}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 0 8px;font-size:13px;color:var(--mute)}
.crumb button{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:32px;text-align:left}
.crumb button span:last-child{overflow-wrap:anywhere;max-width:100%;color:var(--ink);font-weight:600}
.crumb .sep{color:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.flow{display:grid;grid-template-columns:var(--gc);gap:8px 34px;align-items:start;margin-bottom:12px}

@media (max-width:899px){.flow{grid-template-columns:minmax(0,1fr);gap:30px}.flow .col{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.card.ghost{min-height:0;background:transparent;border-style:dashed;border-left:4px solid var(--ac,var(--todo));opacity:.8}
.card.ghost .cn{font-size:12.5px;font-weight:500;color:var(--mute)}
.card.ghost .ct{justify-content:flex-start}.card.ghost .ct svg{margin-left:auto}
.card.ghost .ct .dot{width:9px;height:9px}
.card{display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--sc,var(--todo));border-radius:12px;padding:10px 10px 10px 11px;min-height:112px}
.card.next{border-left-color:var(--now);box-shadow:0 0 0 1px var(--now) inset}
.ct{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.cid{font:600 11.5px var(--fm);color:var(--mute);min-width:0;overflow-wrap:anywhere}
.cn{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.card.e-acc .cn,.card.e-aband .cn{color:var(--mute)}
.cf{margin-top:auto;font:600 12.5px var(--f);color:var(--mute);overflow-wrap:anywhere}

/* toi */
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--marc);border-radius:12px;padding:10px 12px;min-height:56px;width:100%}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.li .tx small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.li .tx small.g{color:var(--ink)}
.li .ub{flex:none;text-align:right;font:600 11px var(--fm);color:var(--mute)}
.li .ub b{display:block;font-size:18px;color:var(--marc)}
/* gantt */
.gw{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;--lw:48%}
@media (min-width:720px){.gw{--lw:360px}}
.gax{display:flex;height:34px;border-bottom:1px solid var(--line)}
.gax .gl{border-right:1px solid var(--line)}
.gl{width:var(--lw);flex:none;min-width:0}
.gt{flex:1;position:relative;min-width:0}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.tick span{position:absolute;top:9px;left:4px;font:600 11px var(--fm);color:var(--mute);white-space:nowrap}
.grow{display:flex;min-height:40px;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.grow .gl{display:flex;align-items:center;gap:4px;padding-left:calc(var(--d,0) * 12px);border-right:1px solid var(--line)}
.grow .gl .chev{width:28px;height:40px}
.grow .gl .rb{min-height:40px;gap:6px}
.grow .gl .tt{font-size:13.5px;line-height:1.25}
.grow .gl .rb{padding:3px 0}
.si{flex:none;display:flex;width:22px;justify-content:center}
.gd{flex:none;margin-left:auto;margin-right:9px;padding-left:6px;font:600 12px var(--f);color:var(--mute)}
.grow.l-app .tt{font-weight:700}.grow.l-chantier .tt{font-weight:700}.grow.l-mission .tt{font-weight:600}
.grow .gt{overflow:hidden}
.gb{position:absolute;top:50%;height:12px;margin-top:-6px;border-radius:6px;min-width:4px;background:var(--sc,var(--todo))}
.gb.e-rel{background:repeating-linear-gradient(135deg,var(--doing) 0 6px,color-mix(in srgb,var(--doing) 45%,transparent) 6px 12px)}
.gb.e-aband{opacity:.45}
.gb.agg{height:6px;margin-top:-3px;background:color-mix(in srgb,var(--sc) 55%,transparent)}
.gb.agg.st-todo{background:color-mix(in srgb,var(--todo) 45%,transparent)}
.gb.cut{border-top-left-radius:0;border-bottom-left-radius:0}
.gbx{position:absolute;inset:0;width:100%;display:block}
.gl2,.gw2,.gf{position:absolute;top:50%;border-radius:4px}
.gl2{height:4px;margin-top:-2px;background:color-mix(in srgb,var(--sc) 45%,transparent)}
.gw2{height:12px;margin-top:-6px;min-width:4px;background:var(--sc)}
.gw2.e-rel{background:repeating-linear-gradient(135deg,var(--doing) 0 6px,color-mix(in srgb,var(--doing) 45%,transparent) 6px 12px)}
.gw2.e-aband,.gl2.e-aband{opacity:.45}
.gf{height:12px;margin-top:-6px;min-width:4px;border:1.5px dashed var(--sc);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--sc) 22%,transparent) 0 4px,transparent 4px 8px)}
.gf.agg{height:6px;margin-top:-3px;border-width:1px}
.gh2,.gq{position:absolute;top:50%;border-radius:4px;min-width:3px}
.gh2{height:max(6px,calc(var(--bh,12px) * .5));margin-top:calc(max(6px,var(--bh,12px) * .5) / -2);border:1.5px dotted var(--mute);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--mute) 30%,transparent) 0 3px,transparent 3px 6px)}
.gh2.reel{border-style:solid}
.gq{height:var(--bh,12px);margin-top:calc(var(--bh,12px) / -2);border:1.5px dashed var(--vio);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--vio) 32%,transparent) 0 4px,transparent 4px 8px)}
.cut{border-top-left-radius:0;border-bottom-left-radius:0}
.fut{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--doing) 7%,transparent) 0 6px,transparent 6px 14px);pointer-events:none}
.gax .futl{position:absolute;top:9px;margin-left:6px;font:700 11px var(--fm);color:var(--doing);white-space:nowrap}
.gtx{position:absolute;top:50%;transform:translateY(-50%);font:600 10.5px var(--fm);color:var(--mute);white-space:nowrap;pointer-events:none;padding:1px 5px;border-radius:5px;background:color-mix(in srgb,var(--panel) 90%,transparent)}
.gw{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.gw.drag{cursor:grabbing}
.zrow{display:flex;flex-wrap:wrap;gap:8px}
.avenir{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px 14px 8px;margin-bottom:12px}
.avenir h3{display:flex;align-items:center;gap:6px;margin:0;font-size:15px}
.avenir h3 button{display:flex;align-items:center;gap:6px;min-height:44px;font:inherit;font-weight:700;width:100%}
.avenir h3 button svg{transition:transform .15s;flex:none}.avenir h3 button[aria-expanded="true"] svg{transform:rotate(90deg)}
.avenir h3 small{margin-left:auto;font:600 12px var(--f);color:var(--mute)}
.avenir .grp{font:700 11px var(--fm);color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 2px}
.avr{display:grid;grid-template-columns:7.2em minmax(0,1fr);column-gap:10px;align-items:center;width:100%;min-height:44px;border-top:1px solid var(--line);padding:5px 0;text-align:left}
.avr .qd{font:600 12px var(--fm);color:var(--doing);line-height:1.3}
.avr .qd.td{color:var(--mute)}
.avr .ti{display:flex;align-items:center;gap:6px;min-width:0}
.avr .ti .tt{font-size:14px}
.avr .ti .dot{width:9px;height:9px}
.avr .de{grid-column:2;font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
.avenir .plus{min-height:40px;font-weight:600;color:var(--doing)}
.avenir .sd{font-size:12.5px;color:var(--mute);margin:8px 0 2px}
.gnote{margin-top:8px}
/* téléphone : le titre au-dessus, la barre dessous, sur toute la largeur — rien ne se chevauche */
@media (max-width:719px){
  .gw{--lw:0px}
  .gax .gl{display:none}
  .grow{flex-direction:column;min-height:0;padding:4px 0 8px}
  .grow .gl{width:100%;border-right:0;padding-left:calc(var(--d,0) * 10px)}
  .grow .gl .chev{height:36px}.grow .gl .rb{min-height:36px}
  .grow .gt,.gax .gt{margin:0 10px}.grow .gt{flex:none;height:16px}
  .grow .gl .lvl{min-width:0;font-size:9.5px;height:18px}
}
.nowt{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--now);pointer-events:none;z-index:1}
.gax .nowt span{position:absolute;top:9px;right:5px;font:700 11px var(--fm);color:var(--now);white-space:nowrap}
/* fiche */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--panel);border-top-left-radius:18px;border-top-right-radius:18px;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:720px){.sheet{left:auto;top:0;bottom:0;width:440px;max-height:none;border-radius:0;border-left:1px solid var(--line)}}
.shtop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.shtop .x{margin-left:auto;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:22px;color:var(--mute)}
.shtop .bk{min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600}
.stp{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font:700 12px var(--f);color:#0f1115;background:var(--st,var(--sc,var(--todo)));white-space:nowrap}
.sub{color:var(--mute);font:600 13px var(--fm);margin:-6px 0 12px}
.txt{margin:0;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.txt.vide{color:var(--mute);font-style:italic}
.lvlx{color:var(--mute);font-size:12.5px;margin:0 0 8px}
.sheet h2{font-size:19px;line-height:1.3;margin:4px 0 12px;overflow-wrap:anywhere}
.path{display:grid;gap:2px;margin:0 0 6px}
.path button{display:flex;align-items:center;gap:8px;min-height:36px;padding-left:calc(var(--d,0) * 14px);min-width:0;width:100%}
.path button .tt{font-size:13.5px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.facts div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.facts small{display:block;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.facts b{font:600 14px var(--fm);overflow-wrap:anywhere}
.sec{margin:0 0 14px}
.sec>small{display:block;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.sec .it{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;border-top:1px solid var(--line);padding:4px 0}
.sec .it .tt{white-space:normal;overflow:visible;font-size:14px;line-height:1.3}
.sec .it em{font:600 11px var(--fm);color:var(--mute);font-style:normal;flex:none}
.links{display:grid;gap:8px;margin-top:6px}
.lnk{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;padding:0 14px;border-radius:12px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600}
.lnk.sec2{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.lnk small{font:600 11.5px var(--fm);opacity:.8}
.empty{color:var(--mute);font-size:14px;padding:16px 4px}
@media (max-width:440px){.seg button{padding:0 10px;font-size:13.5px}.ib{padding:0 11px;font-size:13.5px}}
/* ===================== v7 : visuel et animation =====================
   Règles : (1) les animations ne jouent qu'à la navigation (body.anim) : un relevé qui arrive, un pli ou une coche ne rejouent rien ;
   (2) ce qui boucle n'anime que transform et opacité ; (3) prefers-reduced-motion : tout est posé d'emblée, rien ne bouge. */
:root{--vio:#7c5cdb;--k-tache:var(--doing);--k-autre:var(--todo);--k-robot:var(--vio);--gut:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--vio:#9b7be0}}
:root,:root[data-theme="dark"]{--vio:#9b7be0}
button{-webkit-tap-highlight-color:transparent}
.ib,.seg button,.jump button,.card,.li,.qc,.qk,.lnk,.vrow.lk{transition:transform .12s ease,background-color .25s,color .25s,border-color .25s}
.ib:active,.seg button:active,.jump button:active,.card:active,.li:active,.qc:active,.qk:active,.lnk:active{transform:scale(.97)}

/* ---- onglets : icône seule hors du courant (téléphone), icône + mot sur le courant ---- */
.barrow .seg{flex:1;min-width:0;justify-content:space-between}
#tabs{overflow:visible}
#tabs button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;min-width:40px;padding:0 10px}
#tabs svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tabs span{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .32s ease,opacity .22s ease,margin .32s ease}
#tabs button[aria-pressed="true"] span{max-width:80px;opacity:1;margin-left:6px}
@media (min-width:600px){.barrow .seg#tabs{flex:none;justify-content:flex-start}#tabs span{max-width:80px;opacity:1;margin-left:6px}#tabs button{padding:0 14px}}
.jump .chip{border-style:dashed}
.ctrl:not(:has(>:not([hidden]))){display:none}

/* ---- en-tête : anneau d'avancement et pouls ---- */
.sum.hero{display:flex;flex-direction:column;gap:12px;padding:14px}
.hrow{display:flex;align-items:center;gap:16px}
.donut{position:relative;flex:none;width:96px;height:96px}
.donut svg{display:block;width:100%;height:100%}
.donut .dt{fill:none;stroke:var(--line);stroke-width:11}
.donut .ds{fill:none;stroke-width:11}
.donut .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.donut .dc b{font:700 24px/1 var(--fm);letter-spacing:-.02em}
.donut .dc small{font:600 10.5px var(--f);color:var(--mute)}
.hside{min-width:0;flex:1;display:flex;flex-direction:column;gap:9px}
.pulse{display:flex;align-items:center;gap:8px;min-width:0;font:600 12.5px var(--f);color:var(--mute)}
.pulse>*{min-width:0}
.pulse b{font:700 12.5px var(--fm);color:var(--ink);white-space:nowrap}
.pulse i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--done);position:relative}
.pulse i::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--done);opacity:0}
.pulse.off i{background:var(--todo)}
.pulse svg{width:16px;height:16px;flex:none}
.pulse span{overflow-wrap:anywhere}

/* ---- icônes qui vivent ---- */
.ico .spin{transform-box:view-box;transform-origin:10px 10px}
.ico .ck{fill:none}
.ico .pl{transform-box:fill-box;transform-origin:center}
.pill i{position:relative}

/* ---- fiche : entrée ---- */
.skel{height:220px;border-radius:16px;background:linear-gradient(100deg,var(--panel) 30%,var(--panel2) 50%,var(--panel) 70%);background-size:300% 100%;border:1px solid var(--line)}

/* ---- Vitesse ---- */
.vt,.qt{display:flex;flex-direction:column;gap:12px}
.vc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.vh{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;margin-bottom:8px}
.vh h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.vh h3 svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--mute);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.vseg{margin:0}
.vseg button{min-height:40px}
.vleg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font:600 12px var(--fm);color:var(--mute)}
.vleg span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.vleg i{width:9px;height:9px;border-radius:3px;flex:none}
.vleg b{color:var(--ink);font-weight:700}
.vleg .when{color:var(--ink)}
.vhero .hrow{align-items:center}
.vhero .donut{width:112px;height:112px}
.vhero .donut .dc b{font-size:28px}
.vstat{display:flex;flex-direction:column;gap:1px;min-width:0}
.vstat b{font:700 22px/1.15 var(--fm);letter-spacing:-.02em;white-space:nowrap}
.vstat small{font-size:12px;color:var(--mute)}
.trend{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:28px;padding:0 10px;border-radius:99px;font:700 12.5px var(--f);border:1px solid var(--line);color:var(--mute)}
.trend svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.trend.up{color:var(--done);border-color:var(--done)}
.trend.down{color:var(--marc);border-color:var(--marc)}
.ch{display:block;width:100%;height:auto;overflow:visible}
.ch text{font:600 10px var(--fm);fill:var(--mute)}
.ch text.n{fill:var(--ink)}
.ch .g{stroke:var(--line);stroke-width:1}
.ch .b{transform-box:fill-box;transform-origin:50% 100%}
.ch .b.cur{opacity:.6}
.ch .sel{fill:color-mix(in srgb,var(--ink) 8%,transparent)}
.ch .h{fill:transparent;cursor:pointer}
.ch .h:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.ch .ln{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ch .tr{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;opacity:.65}
.ch .ex{fill:none;stroke:var(--mute);stroke-width:1.6;stroke-dasharray:5 5;opacity:.9}
.ch .gh{fill:none;stroke:var(--mute);stroke-width:1.6;stroke-dasharray:1.5 4;stroke-linecap:round;opacity:.8}
.ch .pj{fill:none;stroke-width:1.8;stroke-dasharray:5 4;stroke-linecap:round}
.ch .lim{stroke:var(--now);stroke-width:1.2;stroke-dasharray:4 3;opacity:.85}
.ch .pt{transform-box:fill-box;transform-origin:center}
.ch .nw{stroke:var(--ink);stroke-width:1;opacity:.35}
.ch .lp{transform-box:fill-box;transform-origin:center;fill:none;stroke-width:2}
.vrows{display:flex;flex-direction:column}

.dcl i.c,.dcb i.c{background:var(--doing)}.dcl i.a,.dcb i.a{background:var(--k-autre)}.dcl i.i,.dcb i.i{background:var(--vio)}
.dct{display:flex;flex-direction:column;margin-top:8px}

.dcr:first-child{border-top:0}

.dcb{grid-area:b;display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}

.dcn.o{grid-area:o}.dcn.p{grid-area:p}.dcn.r{grid-area:r}

.dcs{display:flex;flex-direction:column;margin:10px 0 6px}

.sp-a{opacity:.9}

.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ev{display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none;width:100%;text-align:left}
.ev:first-child{border-top:0}
.ev>svg{width:22px;height:22px;flex:none}

/* ---- Quota ---- */
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.qgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:960px){.qgrid{grid-template-columns:repeat(7,minmax(0,1fr))}}
.qc{--vc:var(--todo);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;text-align:center;min-width:0;width:100%}
.qc.ok{--vc:var(--done)}.qc.vig{--vc:var(--marc)}.qc.ko{--vc:var(--now)}.qc.nd{--vc:var(--todo)}
.qc .rw{position:relative;width:min(112px,100%);aspect-ratio:1}
.qc .rw svg{display:block;width:100%;height:100%}
.qc .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.qc .rc b{font:700 23px/1 var(--fm);letter-spacing:-.02em}
.qc .rc small{font:600 11px var(--f);color:var(--mute)}
.qc .qn{font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;max-width:100%;text-align:center}
.qc .qn span{overflow-wrap:anywhere}
.qc .qn i{width:8px;height:8px;border-radius:50%;background:var(--vc);flex:none}
.qc.ko .qn i{animation:blink 1.2s ease-in-out infinite}
.qc .qage{font:700 10.5px var(--fm);color:var(--marc);border:1px solid var(--marc);border-radius:99px;padding:1px 7px}
.ring .rt{fill:none;stroke:var(--line)}
.ring .ra{fill:none;stroke:var(--vc);stroke-linecap:round}
.ring .rx{stroke:var(--ink);stroke-linecap:round}
.ring .ro{fill:none;stroke:var(--vc);opacity:0}
.qk{display:flex;flex-direction:column;gap:6px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;text-align:left;width:100%;min-width:0;--vc:var(--todo);cursor:pointer}
.qk.ok{--vc:var(--done)}.qk.vig{--vc:var(--marc)}.qk.ko{--vc:var(--now)}.qk.nd{--vc:var(--todo)}
.qk .vh{margin-bottom:0}
.qk .vh h3 i{width:9px;height:9px;border-radius:50%;background:var(--vc);flex:none}
.qk .vleg i.ln{width:16px;height:0;border-top:2.5px solid var(--vc);border-radius:2px;background:none}
.qk .vleg i.ex{width:16px;height:0;border-top:2px dashed var(--mute);border-radius:0;background:none}
.qfq{display:flex;flex-direction:column;gap:8px}.qfq .vh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.qfq h3{margin:0;font-size:15px}.qfl{font:600 12px var(--fm);color:var(--mute);margin-top:4px}
.fz{--vc:var(--marc);display:flex;align-items:center;gap:16px;margin:4px 0 12px}.fz.ok{--vc:var(--done)}.fz.ko{--vc:var(--now)}.fz .rw{position:relative;flex:none;width:120px;height:120px}.fz .rw svg{display:block;width:100%;height:100%}.fz .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.fz .rc b{font:700 30px/1 var(--fm)}.fz .rc small{color:var(--mute);font-size:12px}.fz h2{margin:0 0 4px}
.fz-rs{display:flex;flex-direction:column;gap:10px;margin:0 0 12px}.fz-r{display:grid;grid-template-columns:minmax(0,9.5em) minmax(40px,1fr) auto;align-items:center;gap:10px;font-size:14px}.fz-r b{font:600 13px var(--fm);white-space:nowrap}.fz-r .qbar{height:10px}.fz-d{margin-top:8px}.fz-d summary{cursor:pointer;font-weight:600;padding:10px 0;min-height:44px;display:flex;align-items:center}
@media (max-width:420px){.fz{flex-direction:column;align-items:flex-start}}
.qgr3{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:760px){.qgr3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.qinfo{margin:0 0 14px}
.qinfo .qrows{margin-top:6px}
.qhint{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12.5px}
.qhint svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- Gantt : maintenant qui avance, tâches actives qui brillent ---- */
.nowt{box-shadow:0 0 10px color-mix(in srgb,var(--now) 55%,transparent);transition:left 20s linear}
.fut{transition:left 20s linear}
.gax .nowt::before,.gax .nowt::after{content:"";position:absolute;top:-1px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%}
.gax .nowt::before{background:var(--now)}
.gax .nowt::after{border:2px solid var(--now);opacity:0}
.gw2.live,.gl2.live{overflow:hidden}
.gw2.live::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.55) 50%,transparent 80%);transform:translateX(-100%)}
.gw2.e-rel.live{background-size:17px 17px}

/* ---- grand écran : toute la largeur (plus de colonne centrée) et toute la hauteur ----
   Les seuils (720, 760, 1100 px) sont les mêmes que dans vitesse.js, quota.js et vGantt : le JS en déduit la largeur des graphiques. */
.gw{--rh:40px;--bh:12px}
.gw2,.gf{height:var(--bh);margin-top:calc(var(--bh) / -2)}
.gl2{height:max(4px,calc(var(--bh) / 3));margin-top:calc(max(4px,var(--bh) / 3) / -2)}
.gf.agg{height:calc(var(--bh) / 2);margin-top:calc(var(--bh) / -4)}
.avcols{display:grid;grid-template-columns:minmax(0,1fr);column-gap:32px}
.avg{min-width:0}
@media (min-width:720px){
  .grow{min-height:var(--rh)}
  .grow .gl .chev{height:var(--rh)}
  .grow .gl .rb{min-height:var(--rh)}
  /* le Gantt d'abord, la prévision en clair dessous : sinon elle le repousse hors de l'écran */
  #view.v-gantt{display:flex;flex-direction:column}
  #view.v-gantt>.gw{order:1}
  #view.v-gantt>.gnote{order:2}
  #view.v-gantt>.avenir{order:3;margin:12px 0 0}
}
@media (min-width:760px){
  .vt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .vt>.vtop,.vt>.vhero,.vt>.vbars,.vt>.vfeed{grid-column:1/-1}
}
@media (min-width:900px){
  :root{--gut:clamp(20px,2.4vw,44px)}
  .sum.hero{flex-direction:row;align-items:center;gap:32px;padding:16px 24px}
  .sum.hero .hrow{flex:none}
  .sum.hero .nums{flex:1;margin-top:0;gap:16px}
  .nums b{font-size:28px}.nums small{font-size:13px}
  .zrow{justify-content:space-between}
}
@media (min-width:1100px){
  .vt{grid-template-columns:repeat(6,minmax(0,1fr))}
  .vt>.vhero{grid-column:span 2;display:flex;flex-direction:column;justify-content:center}
  .vt>.vbars{grid-column:span 4}
  .vt>.vs3{grid-column:span 3}
  .vt>.vtop,.vt>.vfeed{grid-column:1/-1}
  .vfeed .feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}
  .vfeed .feed li:nth-child(2) .ev{border-top:0}
  .va .vxs{flex-basis:auto;padding:0}
  .qt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .qt>.qhint,.qt>.qgrid,.qt>.qgr3,.qt>.solo{grid-column:1/-1}
  #view.v-plan:has(>.app){columns:2;column-gap:12px}
  #view.v-plan>.app{break-inside:avoid}
  #view.v-taches .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .avcols{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:1200px){
  html,body{font-size:16px}
  h1{font-size:26px}
  .aname{font-size:18px}.tt{font-size:15.5px}.mt{font-size:13px}
  .grow .gl .tt{font-size:15px}.gd{font-size:13px}.gtx{font-size:12px}
  .gax{height:38px}.tick span,.gax .futl,.gax .nowt span{top:11px;font-size:12px}
  .ch text{font-size:11px}
  .vc,.qk{padding:18px}
  .vh h3{font-size:16px}
  .vstat b{font-size:26px}
  .vhero .donut{width:128px;height:128px}.vhero .donut .dc b{font-size:32px}
  .vrow .nm{font-size:15px}.ev .et b{font-size:15px}
  .qc .rw{width:min(140px,100%)}.qc .rc b{font-size:28px}.qc .qn{font-size:14px}
}
@media (min-width:1800px){#view.v-plan:has(>.app){columns:3}}

@media (prefers-reduced-motion:no-preference){
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes arc{from{stroke-dasharray:0 var(--C)}}
@keyframes pop{from{transform:scale(0);opacity:0}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{to{transform:translateX(100%)}}
@keyframes barber{to{background-position:17px 0}}
@keyframes blink{50%{opacity:.25}}
@keyframes glow{0%,100%{opacity:0}50%{opacity:.38}}
@keyframes flash{0%{background:color-mix(in srgb,var(--done) 28%,transparent)}100%{background:transparent}}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes sheetSide{from{transform:translateX(100%)}}
@keyframes skel{to{background-position:-300% 0}}
@keyframes breathe{50%{transform:scale(1.08)}}
.skel{animation:skel 1.4s linear infinite}
.sheet.in{animation:sheetUp .34s cubic-bezier(.2,.8,.2,1)}
.scrim.in{animation:fade .25s ease-out}
@media (min-width:720px){.sheet.in{animation-name:sheetSide}}
/* présent en continu : seulement ce qui est vrai */
.pill:not(.old):not(.ko) i::after,.pulse:not(.off) i::after,.gax .nowt::after{animation:ping 2.2s ease-out infinite}
.ico .spin{animation:spin 1.3s linear infinite}
.ico .pl{animation:breathe 1.8s ease-in-out infinite}
.gw2.live::after{animation:shine 1.7s ease-in-out infinite}
.gw2.e-rel.live{animation:barber 1s linear infinite}
.ch .lp{animation:ping 2s ease-out infinite}
.ch .b.cur{animation:blink 2.4s ease-in-out infinite}
.qc.ko .ro{animation:glow 2.2s ease-in-out infinite}
.ev.new{animation:flash 2.2s ease-out}
/* navigation : tout arrive en même temps, par vagues courtes */
/* « backwards » et non « both » : une fois l'entrée finie, l'élément redevient normal (pas de contexte d'empilement résiduel qui passerait les flèches devant les cartes) */
.anim .card,.anim .li,.anim .row,.anim .app,.anim .avenir,.anim .grow{animation:in .38s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 24ms)}
.anim .vc,.anim .qc,.anim .qk,.anim .vseg{animation:up .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
.anim .ev,.anim .vrow{animation:in .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 40ms + 150ms)}
.anim .bar3 span{transform-origin:0 50%;animation:growx .9s cubic-bezier(.2,.8,.2,1) both}
.anim .gw2,.anim .gl2,.anim .gf,.anim .gk{transform-origin:0 50%;animation:growx .75s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 26ms + 120ms)}
.anim .gw2.live,.anim .gl2.live{animation-name:growx}
.anim .ra,.anim .ds{animation:arc 1.15s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms + 120ms)}
.anim .ds{animation-delay:calc(var(--d,0) * 140ms + 100ms)}
.anim .ch .b{animation:growy .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--b,0) * 22ms + 200ms)}
.anim .ch .b.cur{animation:growy .65s cubic-bezier(.2,.8,.2,1) both,blink 2.4s ease-in-out 1.2s infinite;animation-delay:calc(var(--b,0) * 22ms + 200ms),1.2s}
.anim .ch .dr{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.2s cubic-bezier(.4,0,.2,1) both;animation-delay:.25s}
.anim .ch .ar{animation:fade .9s ease-out .6s both}
.anim .ch .dots{animation:fade 1s ease-out .35s both}
.anim .ch .tr,.anim .ch .ex,.anim .ch .pj,.anim .ch .gh{animation:fade .8s ease-out .9s both}
.anim .ch .pt{animation:pop .45s cubic-bezier(.3,1.6,.5,1) 1s both}
.anim .sp-l{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s ease-out .3s both}
.anim .sp-a{animation:fade .8s ease-out .7s both}
.anim .ico .ck{stroke-dasharray:1;stroke-dashoffset:0;animation:draw .6s ease-out .25s both}
}

/* ---- v8 : rien de coupé (filtres et raccourcis passent à la ligne), liens entre tâches, bande de prévision ---- */
#filters,#zoom,#pan,#cap{flex-wrap:wrap;border-radius:22px;overflow:visible}
@media (min-width:720px){.jump{flex-wrap:wrap;overflow:visible}}
.hside .pulse svg.ico{width:16px;height:16px}
.clinks,.glinks{position:absolute;left:0;top:0;pointer-events:none;overflow:hidden;z-index:2}
.clinks{z-index:0}
.gw.drag .glinks{opacity:0}
#view.v-taches{position:relative}
.card{position:relative;z-index:1}
.lk{fill:none;stroke:var(--mute);stroke-width:1.5;opacity:.5;stroke-dasharray:5 4;transition:opacity .2s}
.lk.ok{stroke:var(--done);stroke-dasharray:none;opacity:.55}
.lk.marc{stroke:var(--marc);stroke-dasharray:2 4;opacity:.8}
.focus .lk.marc.on{stroke:var(--marc)}
.glinks .lk{stroke-width:1.4;opacity:.55}
.glinks .lk.ok{opacity:0}
.focus .clinks{z-index:3}
.focus .lk{opacity:.07}
.focus .lk.on{opacity:1;stroke-width:2.2;stroke:var(--ink)}
.focus .lk.ok.on{stroke:var(--done)}
.focus .card{opacity:.35;transition:opacity .2s}
.focus .card.lkr,.focus .card.lkc{opacity:1}
.focus .card.lkc{border-color:var(--ink)}
.gfocus .grow{opacity:.45;transition:opacity .2s}
.gfocus .grow.lkr,.gfocus .grow.lkc{opacity:1}
.gfocus .glinks .lk{opacity:.08}
.gfocus .glinks .lk.ok{opacity:0}
.gfocus .glinks .lk.on{opacity:1;stroke-width:2.2;stroke:var(--ink)}
.gfocus .glinks .lk.ok.on{stroke:var(--done);opacity:1}
/* bande de prévision : fin prévue, trou mesuré, dépôts à l'arrêt, trou prévu */

@media (min-width:900px){.fprev{grid-template-columns:repeat(4,minmax(0,1fr))}}

.ft .ars i{width:9px;height:9px;border-radius:50%;background:var(--ac);flex:none}

@media (min-width:720px){#view.v-gantt>.fprev{order:0}}
@media (min-width:1200px){.ft b{font-size:24px}.ft small{font-size:12.5px}}
@media (prefers-reduced-motion:no-preference){
@keyframes ants{to{stroke-dashoffset:-18}}
.lk:not(.ok){animation:ants 1.4s linear infinite}

}

    } else {

  }
  if (key === 'api') h += `<p class="qnote">Neon (base de données) : pas de lecture d'usage depuis cette session. Rien n'est inventé pour combler.</p>`;

}

/* ---------- Coût Claude par fil (Marc, 21/10/2026, réponse A a) ----------
   La page lit elle-même le coût de chaque fil du projet par le connecteur « Claude Code Remote » de la personne qui regarde :
   aucun quota consommé. Le coût est celui que donne la session (équivalent API en $ US, cumulé depuis la création du fil) ; ce n'est
   pas le % de la semaine Claude. Chaque lecture est gardée dans la base de la page (conso/<session>) : le coût sur une période est
   le coût d'aujourd'hui moins celui du dernier relevé avant son début, ou le coût entier si le fil est né dans la période.
   Avant le premier relevé d'un fil plus ancien que la période, on ne sait pas : il est compté depuis ce relevé et dit « partiel ». */
const FILS = {etat: 'attente', list: [], at: null, err: null, pts: {}};
const FIL_PTS = 300;
// la réponse du connecteur n'a pas de forme documentée : on cherche l'objet { ccr: … } dans le JSON ou dans le texte
function filsCcr(p){
  if (p && typeof p === 'object'){ if (p.ccr) return p.ccr; if (p.data || p.id) return p; }
  const s = typeof p === 'string' ? p : JSON.stringify(p || '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b <= a) return null;
  try { const o = JSON.parse(s.slice(a, b + 1)); return o.ccr || o; } catch(e){ return null; }
}
const filDe = s => ({id: s.id, titre: s.title || s.id, cree: Date.parse(s.created_at), maj: Date.parse(s.updated_at),
  cout: s.external_metadata && s.external_metadata.usage && typeof s.external_metadata.usage.cost_usd === 'number' ? s.external_metadata.usage.cost_usd : null});
async function filsLire(mcp){
  // les fils portent l'étiquette « hearth-thread », le coordinateur « hearth-overview » ; le filtre par étiquette n'existe que pour un appel fait au nom de la personne
  const out = [], vus = new Set(), t0 = Date.now() - 120 * 864e5;
  let apres = null;
  for (let page = 0; page < 6; page++){
    const r = await mcp.callTool('Claude Code Remote', 'list_sessions', {tags: ['hearth-thread', 'hearth-overview'], limit: 100, ...(apres ? {after_id: apres} : {})});
    const c = filsCcr(r && (r.payload != null ? r.payload : r.structuredContent));
    const ds = (c && c.data) || [];
    ds.forEach(s => { if (s && s.id && !vus.has(s.id) && (s.tags || []).some(t => t === 'hearth-thread' || t === 'hearth-overview')){ vus.add(s.id); out.push(filDe(s)); } });
    if (!c || !c.has_more || !c.last_id || !ds.length || ds.every(s => Date.parse(s.created_at) < t0)) break;
    apres = c.last_id;
  }
  return out;
}
// un relevé par fil et par changement de coût (plus un toutes les 6 h, pour qu'une période commence près d'un relevé)
async function filsGarder(db, fils, now){
  const col = db.collection('conso');
  const snap = await col.get();
  snap.docs.forEach(d => { const x = d.data() || {}; FILS.pts[d.id] = Array.isArray(x.pts) ? x.pts : []; });
  for (const f of fils){
    if (f.cout == null) continue;
    const p = FILS.pts[f.id] || [], der = p[p.length - 1];
    if (der && der[1] === f.cout && now - der[0] < 6 * H) continue;
    const np = [...p, [now, f.cout]];
    const garde = np.length > FIL_PTS ? [np[0], ...np.slice(-(FIL_PTS - 1))] : np;
    try { await col.doc(f.id).set({pts: garde, titre: f.titre, cree: f.cree}); FILS.pts[f.id] = garde; }
    catch(e){ FILS.pts[f.id] = np; }      // lecture seule : la période reste juste pour cette ouverture, rien n'est perdu
  }
}
// coût de chaque fil sur [t0, maintenant]
function filsPeriode(t0){
  if (FILS.etat !== 'ok') return null;
  const rows = []; let partiels = 0, inconnus = 0;
  FILS.list.forEach(f => {
    if (f.cout == null){ inconnus++; return; }
    let v = null, part = false;
    if (f.cree >= t0) v = f.cout;
    else {
      const p = FILS.pts[f.id] || [], av = p.filter(x => x[0] <= t0).pop();
      if (av) v = f.cout - av[1];
      else if (p.length){ v = f.cout - p[0][1]; part = true; }
      else { inconnus++; return; }
    }
    if (part) partiels++;
    if (v > 0.005) rows.push({id: f.id, titre: f.titre, v, part});
  });
  rows.sort((a, b) => b.v - a.v);
  return {rows, tot: rows.reduce((s, r) => s + r.v, 0), partiels, inconnus, n: FILS.list.length, at: FILS.at};
}
function filsHTML(t0, mode){
  const P = filsPeriode(t0);
  if (!P){
    const why = FILS.etat === 'attente' ? 'lecture en cours' : FILS.etat === 'absent' ? 'connecteur Claude Code Remote non autorisé pour cette page' : 'lecture impossible (' + (FILS.err || 'erreur') + ')';
    return `<p class="qnote">Coût par fil : ${esc(why)}.</p>`;
  }
  const top = P.rows.slice(0, 8), mo = x => fr(Math.round(x * 100) / 100) + ' $', reste = P.rows.slice(8).reduce((s, r) => s + r.v, 0);
  // le détail de la mesure passe en infobulle : la carte ne garde que les barres
  const note = `${P.n} fils lus à ${hh(P.at)} par ton connecteur Claude Code Remote. Coût en équivalent API ($ US) donné par chaque session, pas le % de ta semaine.`
    + (P.partiels ? ` ${P.partiels} fil(s) plus ancien(s) que la période : comptés depuis le premier relevé de la page (« ≥ »).` : '')
    + (P.inconnus ? ` ${P.inconnus} sans coût lisible : non comptés, ce n'est pas un zéro.` : '');
  const rows = top.map(r => ({t: r.titre, v: r.v, lab: (r.part ? '≥ ' : '') + mo(r.v), title: (r.part ? 'au moins ' : '') + mo(r.v) + ' US' + (P.tot ? ' · ' + Math.round(r.v / P.tot * 100) + ' % de la période' : '')}));
  if (P.rows.length > top.length) rows.push({t: '+ ' + (P.rows.length - top.length) + ' autres', v: reste, lab: mo(reste), col: 'var(--mute)'});
  return `<div class="bcard qqui"><div class="bh" title="${esc(note)}"><span>Coût par fil</span><b ${cu(Math.round(P.tot), 0)}>${esc(nfmt(Math.round(P.tot)))}</b><small>$ US · ${esc(VPL[mode])}</small>${P.inconnus ? `<em class="chip">${P.inconnus} sans coût</em>` : ''}</div>`
    + (top.length ? barRows(rows) : `<p class="qnote">Aucun fil n'a consommé sur cette période.</p>`) + `</div>`;
}
(async function fils(){
  if (!(window.claude && typeof window.claude.use === 'function')) { FILS.etat = 'absent'; return; }
  let mcp = null, db = null;
  try { mcp = await window.claude.use('mcp'); } catch(e){}
  try { db = await window.claude.use('db'); } catch(e){}
  if (!mcp){ FILS.etat = 'absent'; return; }
  const STOP = ['needs_reauth', 'server_not_connected', 'selection_required', 'not_in_manifest', 'blocked_by_policy', 'server_not_found', 'not_granted'];
  for (;;){
    if (document.hidden) await new Promise(res => document.addEventListener('visibilitychange', res, {once: true}));
    try {
      const l = await filsLire(mcp), now = Date.now();
      if (db) { try { await filsGarder(db, l, now); } catch(e){} }
      FILS.list = l; FILS.at = now; FILS.etat = 'ok'; FILS.err = null;
    } catch(e){
      if (e && STOP.includes(e.code)){ FILS.etat = 'absent'; if (typeof M !== 'undefined' && M && ST.tab === 'rythme') render(); return; }
      if (FILS.etat !== 'ok'){ FILS.etat = 'erreur'; FILS.err = (e && (e.code || e.message)) || 'erreur'; }
    }
    if (typeof M !== 'undefined' && M && ST.tab === 'rythme') render();
    await new Promise(res => setTimeout(res, 10 * 60e3));
  }
})();

/* ---------- onglet Rythme, partie Vitesse : à quelle cadence les PR sortent ----------
   Source : CUR.prlog = toutes les PR fusionnées des 10 dépôts sur 92 jours (fetch.py, depuis le 21/10 ; 8 jours avant). Rien n'est estimé :
   un compte est un compte, un délai est « fusionnée moins ouverte ». Une période plus longue que les traces le dit, elle ne complète pas.
   Marc, 21/10 : la durée choisie (24 h, 7 j, 1 mois, 3 mois) vaut pour toutes les courbes, et chaque compte se détaille par app et par
   « qui » (Jules, fil Claude, autre). Jules se reconnaît à l'étiquette `jules` de la tâche liée, jamais au nom de la branche. */
const KINDS = [['tache', 'tâches', 'var(--k-tache)'], ['autre', 'autres', 'var(--k-autre)'], ['robot', 'robots', 'var(--k-robot)']];
const QUI = [['jules', 'Jules', 'var(--marc)'], ['claude', 'Claude', 'var(--doing)'], ['copilot', 'Copilot', 'var(--a-mem)'], ['robot', 'robots', 'var(--k-robot)'], ['autre', 'autres', 'var(--k-autre)']];
const VPL = {'24h': '24 h', '7j': '7 j', '30j': '1 mois', '90j': '3 mois'};
const FPH = new Intl.DateTimeFormat('en-CA', {timeZone: TZ, hourCycle: 'h23', hour: '2-digit', minute: '2-digit', second: '2-digit'});
// minuit (heure du Québec) du jour qui contient t
const midnight = t => { const p = Object.fromEntries(FPH.formatToParts(new Date(t)).map(x => [x.type, +x.value])); return t - (((p.hour * 60 + p.minute) * 60 + p.second) * 1000 + ((t % 1000) + 1000) % 1000); };
const sumA = a => a.reduce((s, x) => s + x, 0);
// largeur d'une carte : grille de 6 colonnes en grand écran (≥ 1100 px), 2 en écran moyen (≥ 760 px), 1 sur téléphone, comme le CSS
function cardW(span){
  const VW = vw(), gap = 12;
  if (innerWidth >= 1100) return Math.floor((VW - 5 * gap) / 6 * span + (span - 1) * gap);
  if (innerWidth >= 760 && span === 3) return Math.floor((VW - gap) / 2);
  return VW;
}
const vMode = () => VPS.includes(ST.vp) ? ST.vp : '24h';
// tranches de la période : 24 heures, ou 7, 30, 91 jours (minuits du Québec, heure d'été comprise). 3 mois = une barre par jour (Marc, 21/10)
function vBuckets(mode, now){
  if (mode === '24h'){ const h0 = Math.floor(now / H) * H; return Array.from({length: 24}, (_, i) => { const a = h0 - (23 - i) * H; return {a, b: a + H}; }); }
  const nj = mode === '7j' ? 7 : mode === '30j' ? 30 : 91, st = []; let s = midnight(now);
  for (let i = 0; i < nj; i++){ st.unshift(s); s = midnight(s - H); }
  return st.map((a, i) => ({a, b: i < nj - 1 ? st[i + 1] : midnight(a + 30 * H)}));
}
// les catégories du découpage choisi : [clé, libellé, couleur]
function vCats(split){
  if (split === 'app') return (CUR.repos || []).map(r => [r.k, r.name, `var(--a-${r.k})`]);
  return split === 'qui' ? QUI : KINDS;
}
// qui a fait la PR : Jules (étiquette de la tâche liée), Claude (branche claude/… d'un fil, agence/… d'une session du PC),
// un robot (auteur …[bot] : Dependabot, Vercel), sinon « autres » (branche nommée à la main : Marc ou une session hors convention)
// Jules : la PR elle-même (critère du fil Jules, 21/10 : corps qui cite jules.google.com/task/ ou étiquette par-jules) ; relevé plus ancien : l'étiquette de la tâche
const quiDe = (x, l) => (CUR && CUR.prlog_j ? x.j : l && l.j) ? 'jules' : /^(claude|agence)\//.test(x.b || '') ? 'claude' : /^copilot\//i.test(x.b || '') || /^copilot(-swe-agent)?(\[bot\])?$/i.test(x.au || '') ? 'copilot' : /\[bot\]$/.test(x.au || '') || x.k === 'robot' ? 'robot' : 'autre';
function vModel(mode, split = 'type'){
  const L = CUR && CUR.prlog;
  if (!Array.isArray(L)) return null;
  const cats = vCats(split);
  const now = M.asof, B = vBuckets(mode, now), n = B.length, t0 = B[0].a;
  const key = Object.fromEntries((CUR.repos || []).map(r => [r.k, r])), byPr = {};
  M.leaves.forEach(l => { if (l.pr) byPr[(l.pr.repo || l.repo).toLowerCase() + '#' + l.pr.n] = l; });
  const z = () => Object.fromEntries(cats.map(c => [c[0], 0]));
  const cnt = B.map(() => ({...z(), n: 0, d: []})), items = [], apps = {};
  L.forEach(x => {
    const m = Date.parse(x.m), c = Date.parse(x.c);
    if (!(m >= t0 && m <= now)) return;
    let i = B.findIndex(b => m >= b.a && m < b.b); if (i < 0) i = n - 1;
    const r = key[x.r], l = r ? byPr[r.repo.toLowerCase() + '#' + x.n] : null;
    const k = KINDS.some(z => z[0] === x.k) ? x.k : 'autre', d = Math.max(0, (m - c) / 60e3), qui = quiDe(x, l);
    const cat = split === 'app' ? x.r : split === 'qui' ? qui : k;
    if (cnt[i][cat] == null) cnt[i][cat] = 0;

// une tâche d'une autre mission ou d'une autre app reliée à celles-ci devient une carte fantôme, au bord gauche (elle est attendue) ou droit (elle attend)
function flow(ls, a){
  const inG = new Set(ls.map(l => l.ref)), rang = new Map(), enCours = new Set();
  const rg = l => {
    if (rang.has(l.ref)) return rang.get(l.ref);
    if (enCours.has(l.ref)) return 0;                                   // dépendances en boucle : signalées ailleurs, ici on ne boucle pas
    enCours.add(l.ref);
    const r = Math.max(-1, ...(l.waits || []).filter(w => !w.unknown && inG.has(w.ref)).map(w => rg(M.N[w.ref]))) + 1;
    enCours.delete(l.ref); rang.set(l.ref, r); return r;
  };
  ls.forEach(rg);
  const gIn = [], gOut = [], vus = new Set();
  ls.forEach(l => {
    (l.waits || []).forEach(w => { if (!inG.has(w.ref) && !vus.has('i' + w.ref)){ vus.add('i' + w.ref); gIn.push(w); } });
    (l.blocks || []).forEach(b => { if (!inG.has(b.ref) && !vus.has('o' + b.ref)){ vus.add('o' + b.ref); gOut.push(b); } });
  });

  const relie = l => rang.get(l.ref) > 0 || (l.waits || []).some(w => w.unknown || !inG.has(w.ref)) || (l.blocks || []).length > 0;

  if (gOut.length) cols.push(gOut.map(x => fantome(x, a)));

    // les 12 dernières heures et les 36 prochaines : le détail du jour reste lisible ; « 7 j » montre plus loin
    t0 = Math.max(Math.min(now - 2 * H, ...st), now - 12 * H);
    t1 = Math.min(Math.max(now + 2 * H, ...fe), now + 36 * H);
  } else { const z = (+ST.z) * H; t0 = now - z * 0.4; t1 = now + z * 0.6; }
  let span = t1 - t0; t1 += span * 0.03; t0 -= span * 0.01; span = t1 - t0;
  t0 += ST.pan; t1 += ST.pan; GW.span = span; GW.t0 = t0;
  const X = t => (t - t0) / span * 100, CL = t => Math.min(Math.max(t, t0), t1);
  const seg = (a, b, cls, extra = '', sty = '') => b < t0 || a > t1 ? '' : `<span class="${cls}${a < t0 ? ' cut' : ''}" style="left:${X(CL(a))}%;width:${Math.max(X(CL(b)) - X(CL(a)), 0.5)}%${sty}"${extra}></span>`;
  // graduations : jamais plus serrées que ~64 px, calées sur l'heure du Québec
  const VW = ($('#view') && $('#view').clientWidth) || 360;
  // colonne des noms : un peu plus du quart de la largeur, entre 320 et 480 px ; sur téléphone, le titre passe au-dessus de la barre
  const LW = innerWidth >= 720 ? Math.round(clamp(VW * .27, 320, 480)) : 0;
  const W = Math.max(120, innerWidth >= 720 ? VW - LW : VW - 20);
  const steps = [15, 30, 60, 120, 180, 360, 720, 1440, 2880, 10080].map(m => m * 60e3);
  const step = steps.find(x => span / x <= W / 80) || steps[steps.length - 1];
  const o = wallT(t0, TZ) - wallT(t0, 'UTC'), ticks = [];
  for (let t = Math.ceil((t0 + o) / step) * step - o; t < t1; t += step) ticks.push(t);
  // minuit porte la date : on sait toujours de quel jour on parle
  const tl = t => step >= 1440 * 60e3 || hh(t) === '00:00' ? jour(t) : hh(t);
  const nowX = X(now), nowIn = nowX >= 0 && nowX <= 100, futX = Math.min(Math.max(nowX, 0), 100);
  const near = t => { if (!nowIn) return (100 - X(t)) / 100 * W < 70; const d = (nowX - X(t)) / 100 * W; return (d > -76 && d < 96) || (100 - X(t)) / 100 * W < 70; };
  const futBg = nowX < 100 ? `<span class="fut" style="left:${futX}%"></span>` : '';
  const axis = `<div class="gax"><div class="gl"></div><div class="gt">${futBg}${ticks.map(t => `<span class="tick" style="left:${X(t)}%">${near(t) ? '' : `<span>${esc(tl(t))}</span>`}</span>`).join('')}`
    + (nowIn ? `<span class="nowt" style="left:${nowX}%"><span>${esc(hh(now))}</span></span>${(100 - nowX) / 100 * W > 70 ? `<span class="futl" style="left:${nowX}%">prévu →</span>` : ''}` : '')
    + `</div></div>`;
  // petit texte à côté d'une barre prévue : toujours émis, c'est fitLabels() qui le place d'après la largeur RÉELLE (après la barre, sinon calé au bord, sinon avant)
  const txt = (a, b, s) => { const xa = X(a), xb = X(b); if (xb < 0 || xa > 100) return '';
    return `<span class="gtx" data-xa="${xa.toFixed(3)}" data-xb="${xb.toFixed(3)}" style="left:calc(${xb}% + 4px)">${esc(s)}</span>`; };
  const body = rows.map(({n, d}) => {
    let bars = '';
    const sc = (n.leaf ? 'e-' + n.e : 'st-' + n.st) + (n.oubli ? ' oubli' : '');
    // le trou : la tâche était prête et rien ne tournait pour elle (trait plein = mesuré, pointillé = prévu)
    if (n.hole) bars += seg(n.hole.a, n.hole.b, 'gh2' + (n.hole.reel ? ' reel' : ''), ` title="trou de ${esc(dur(n.hole.d))}"`);
    if (n.lvl === 'app'){
      // au plus deux traits : « au moins une tâche travaille » et « deux en même temps » (les places) ;
      // un trait par tâche donnait des dizaines de lignes illisibles (Marc, 21/10)
      const xs = M.leaves.filter(l => l.rl === n.rl).flatMap(l => (l.cls || []).filter(c => c.b >= t0 && c.a <= t1));
      const ev = xs.flatMap(c => [[c.a, 1], [c.b, -1]]).sort((x, y) => x[0] - y[0] || x[1] - y[1]);
      const niv = [[], []]; let d = 0, dmax = 0;
      ev.forEach(([t, k]) => { const av = d; d += k; dmax = Math.max(dmax, d);
        [0, 1].forEach(i => { if (av <= i && d > i) niv[i].push([t, t]); else if (av > i && d <= i) niv[i][niv[i].length - 1][1] = t; }); });
      const colle = (t1 - t0) / 160;   // deux périodes plus proches qu'un point à l'écran ne font qu'un trait
      const lisse = xs => xs.reduce((r, x) => { const z = r[r.length - 1]; if (z && x[0] - z[1] <= colle) z[1] = Math.max(z[1], x[1]); else r.push([...x]); return r; }, []);
      const nc = Math.min(2, dmax);
      [0, 1].slice(0, nc).forEach(i => lisse(niv[i]).forEach(([a, b]) => {
        const o = `;--o:${nc > 1 ? (i ? 4 : -4) : 0}px`, t = ` title="${i ? 'deux tâches en même temps' : 'au moins une tâche en travail'}"`;
        if (a < now) bars += seg(a, Math.min(b, now), 'gk e-cours', t, o);
        if (b > now) bars += seg(Math.max(a, now), b, 'gk pv e-cours', t, o);
      }));
      if (nc > 1) bars = bars.replace(/<span class="gk/g, '<span class="gk n2');
    } else if (n.start != null){
      const end = n.end || now;
      // vie réelle de l'élément (fine), puis les plages de travail mesurées (épaisses)
      // l'état au fil du temps, jusqu'à la fin (Marc, 28/10) : une tâche acceptée ou abandonnée montre aussi son historique, une mission ou un chantier l'état de ses tâches
      const hist = etatsOf(n, seg);
      bars += hist || seg(n.start, end, `gl2 ${sc}`);
      // une tâche active (modifiée il y a moins de 30 min) : sa dernière plage de travail brille
      const lv = n.leaf && (n.e === 'cours' || n.e === 'rel') && actif(n) ? ' live' : '';
      if (n.leaf) (n.work || []).forEach((w, wi, arr) => { bars += seg(w[0], Math.max(w[1], w[0] + 10 * 60e3), `gw2 ${sc}${wi === arr.length - 1 ? lv : ''}`); });
      if (n.leaf && !n.work.length) bars += seg(n.start, end, `gw2 ${sc} nw${lv}`);
      if (!n.leaf && n.fini && n.end != null){
        if (!hist) bars += seg(n.start, n.end, `gb agg ${n.sp ? 'e-fus' : 'st-done'}`);
        if (n.end >= t0 && n.end <= t1) bars += `<span class="gfin${n.sp ? ' sp' : ''}" style="left:${X(n.end)}%" title="${esc(finiTxt(n) + ' ' + quand(n.end))}"></span>`;
      }
      // oubliée : le silence depuis la dernière modification
      if (n.oubli && n.last != null) bars += seg(n.last, now, 'gq', ` title="rien depuis ${esc(dur(now - n.last))}"`);
    }
    // futur : la fin prévue (hachuré)
    let tx = '';
    if (n.lvl !== 'app' && n.open !== false && n.fe != null && n.st !== 'done' && (n.start != null || n.fs != null)){
      const a = n.start != null ? Math.max(now, n.start) : n.fs;
      if (n.fe > a) bars += seg(a, n.fe, `gf ${sc}${n.leaf ? '' : ' agg'}`);
      tx = n.leaf ? txt(a, n.fe, n.late ? 'plus long que d\'habitude' : n.start != null ? 'fin ≈ ' + hh(n.fe) : hh(n.fs) + ' → ' + hh(n.fe)) : txt(a, n.fe, 'fin ≈ ' + quand(n.fe, 1));
    }
    const key = 'g:' + n.ref, op = !n.leaf && isOpen(key, defOpen(n, 'g'));
    const hasKids = !n.leaf && n.children.some(c => c.leaf || shown(c));
    if (n.leaf && n.start == null && n.fs == null && n.st !== 'done') tx = txt(now, now, n.e === 'marc' ? 'attend ton geste' + (n.oub ? ' · en retard de ' + hDur(n.oub.heures) : '') + (n.fm && n.fm.retient_n ? ' · retient ' + n.fm.retient_n + (n.fm.retient_n > 1 ? ' tâches' : ' tâche') : '') : metaOf(n).t);
    const label = (n.lvl === 'app' ? `<span class="dot" style="--ac:var(--a-${esc(n.k)})"></span>` : n.leaf ? `<span class="si" title="${esc(stLabel(n))}">${ico(n)}</span>` : lvlChip(n.lvl))
      + (!n.leaf && n.fini ? `<span class="si" title="${esc(finiTxt(n))}">${ico(n)}</span>` : '');
    const lab = n.start == null ? (n.fs == null ? '—' : '≈ ' + dur(n.fe - n.fs)) : n.end ? dur(n.end - n.start) : dur(now - n.start);
    return `<div class="grow l-${esc(n.lvl)}${n.leaf ? ' e-' + n.e : ''}${n.oubli ? ' oubli' : ''}" data-ref="${esc(n.ref)}"${n.lvl === 'app' ? ` id="a-${esc(n.ref)}"` : ''}><div class="gl" style="--d:${d}">`
      + (hasKids ? `<button class="chev" data-tog="${esc(key)}" aria-expanded="${op}" aria-label="Ouvrir ou fermer">${chevSvg}</button>` : `<span class="chev sp"></span>`)
      + `<button class="rb" data-open="${esc(n.ref)}">${label}<span class="tt">${esc(n.t)}</span><span class="gd c ${sc}">${esc(lab)}</span></button></div>`
      + `<div class="gt">${futBg}<button class="gbx" data-open="${esc(n.ref)}" aria-label="${esc(n.t)}">${bars}</button>${tx}${nowIn ? `<span class="nowt" style="left:${nowX}%"></span>` : ''}</div></div>`;
  }).join('');
  const P = M.P, rel = P.TR.fiable ? hfmt(P.REL) : '15 min par défaut';
  return prevHTML() + aVenir(now) + `<div class="gw"${LW ? ` style="--lw:${LW}px"` : ''}>${axis}${body}</div>`;
}

/* bande de prévision : fin de tout ce qui est daté, trou mesuré, dépôts à l'arrêt, trou prévu */
function prevHTML(){
  const P = M.P, TR = P.TR, svg = d => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  const IC = {flag: '<path d="M5 21V4M5 4h11l-2.5 4L16 12H5"/>', trou: '<circle cx="12" cy="12" r="8.5"/><path d="M8 12h8"/>', stop: '<rect x="6" y="6" width="12" height="12" rx="3"/>', pie: '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12h8.5"/>'};
  const colOf = rl => { const a = M.apps.find(x => x.rl === rl); return a ? `var(--a-${a.k})` : 'var(--todo)'; };
  const tile = (cls, ico, titre, big, small, extra = '') => `<div class="ft ${cls}" style="--i:${tile.i++}"><div class="fh">${svg(IC[ico])}<span>${esc(titre)}</span></div><b>${big}</b><small>${small}</small>${extra}</div>`;
  tile.i = 0;
  const tot = Object.values(TR.par).reduce((a, b) => a + b, 0) || 1;

  const part = P.busy + P.trou ? Math.round(P.trou / (P.busy + P.trou) * 100) : 0;

    + tile('', 'flag', P.mode === 'file' ? 'Fin, 1 à la fois' : 'Fin prévue', P.fin != null ? esc(quand(P.fin, 1)) : '—', `${P.n} tâche${P.n > 1 ? 's' : ''} datée${P.n > 1 ? 's' : ''}${P.sansDate ? ' · ' + P.sansDate + ' sans date' : ''}`)
    + tile('', 'trou', 'Trou mesuré', TR.n ? esc(hfmt(TR.somme)) : '—', TR.n ? `${TR.n} relais en 72 h · médiane ${esc(hfmt(TR.med))} · moyenne ${esc(hfmt(TR.moy))}` : 'pas encore de mesure', TR.n ? `<div class="mb">${parRepo}</div>` : '')
    + tile(P.arret.length ? 'warn' : '', 'stop', 'À l\'arrêt maintenant', P.sansFile ? '—' : P.arret.length ? P.arret.length + ' dépôt' + (P.arret.length > 1 ? 's' : '') : 'aucun', P.sansFile ? 'file du script indisponible' : P.arret.length ? 'dépôt libre : une suivante à lancer' : 'tout ce qui est prêt tourne',
        P.arret.length ? `<div class="ars">${P.arret.map(a => `<span style="--ac:var(--a-${esc(a.k)})" title="libre depuis ${esc(dur(P.T - a.depuis))} · ${a.prets} tâche${a.prets > 1 ? 's' : ''} prenable${a.prets > 1 ? 's' : ''} dans la file du script"><i></i>${esc(a.app)} <em>${a.prets}</em></span>`).join('')}</div>` : '')
    + tile('', 'pie', 'Trou prévu', esc(hfmt(P.trou)), `${part} % du temps prévu`, `<div class="mb"><i style="flex:${P.busy || 1};background:var(--doing)"></i><i style="flex:${P.trou || 0.001};background:var(--mute)"></i></div>`)
    + `</section>`;
}
/* « Ce qui va se passer » : la prévision en clair, dans l'ordre où elle arrivera */
function aVenir(now){
  const ls = M.leaves.filter(n => n.open && n.fe != null);
  const cours = ls.filter(n => n.st === 'doing').sort((a, b) => a.fe - b.fe);
  const suite = ls.filter(n => n.st === 'todo' && n.fs != null).sort((a, b) => a.fs - b.fs || a.fe - b.fe);
  const sd = M.leaves.filter(n => n.open && n.st === 'todo' && n.fs == null);
  const cnt = w => sd.filter(n => n.why === w).length;
  const op = isOpen('g:avenir', innerWidth >= 720), tout = isOpen('g:avenir:tout', false);
  const qui = n => n.j ? 'Jules' : 'fil Claude';
  const row = (n, q, de) => `<button class="avr" data-open="${esc(n.ref)}"><span class="qd${n.st === 'todo' ? ' td' : ''}">${q}</span><span class="ti"><span class="dot" style="--ac:var(--a-${esc(n.k)})"></span><span class="tt">${esc(n.t)}</span></span><span class="de">${esc(de)}</span></button>`;
  let h = `<section class="avenir"><h3><button data-tog="g:avenir" aria-expanded="${op}">${chevSvg}Ce qui va se passer<small>${cours.length} en cours · ${suite.length} prévues</small></button></h3>`;
  if (op){
    h += `<div class="avcols">`;
    if (cours.length) h += `<div class="avg"><p class="grp">En cours maintenant</p>` + (tout ? cours : cours.slice(0, 5)).map(n => row(n, n.late ? 'plus long<br>que prévu' : 'fin ≈<br>' + esc(quand(n.fe, 0).replace(/^auj\. /, '')), `${n.app} · ${qui(n)} · depuis ${dur(now - n.start)}${n.late ? ' (médiane ' + dur(n.est.d) + ')' : ''}`)).join('') + `</div>`;
    const vu = tout ? suite : suite.slice(0, 6);
    if (vu.length) h += `<div class="avg"><p class="grp">Ensuite, dans l'ordre</p>` + vu.map(n => row(n, esc(quand(n.fs, 0).replace(/^auj\. /, '')) + '<br>→ ' + esc(hh(n.fe)), `${n.app} · ${qui(n)} · ≈ ${dur(n.fe - n.fs)}${n.after ? ' · puis ' + n.after.t : ''}`)).join('') + `</div>`;
    h += `</div>`;
    const reste = Math.max(0, cours.length - 5) + Math.max(0, suite.length - 6);
    if (reste) h += `<button class="plus" data-tog="g:avenir:tout" aria-expanded="${tout}">${tout ? 'Montrer moins' : 'Voir les ' + reste + ' autres'}</button>`;
  }
  return h + `</section>`;
}

/* ---------- fiche ---------- */
function sheetHTML(n){
  if (n === 'sante') return santeHTML();
  if (n === 'fiab') return fiabHTML();
  if (n === 'legende') return legendeHTML();
  if (typeof n === 'string' && n.startsWith('q:')) return quotaSheet(n.slice(2));
  const back = ST.stack.length > 1 ? `<button class="bk" data-back>‹ Retour</button>` : '';
  if (n.leaf) return tacheHTML(n, back);
  let h = `<div class="shtop">${back}${lvlChip(n.lvl, true)}<span class="stp ${n.fini && n.sp ? 'e-fus' : 'st-' + n.st}">${esc(n.fini ? finiTxt(n) : STX[n.st] || '')}</span><button class="x" data-close aria-label="Fermer">×</button></div>`;
  const p = n.lvl === 'app' ? [] : path(n), a = n.lvl === 'app' ? null : topApp(M, n);
  if (a || p.length){
    h += `<div class="path">` + (a ? `<button data-open="${esc(a.ref)}" style="--d:0;--ac:var(--a-${esc(a.k)})">${lvlChip('app')}<span class="tt">${esc(a.app)}</span></button>` : '')
      + p.map((x, i) => `<button data-open="${esc(x.ref)}" style="--d:${i + 1}">${lvlChip(x.lvl)}<span class="tt">${esc(x.t)}</span></button>`).join('') + `</div>`;
  }
  h += `<h2>${esc(n.t)}</h2>`;
  const f = [];
  if (n.leaf){
    f.push(['Durée', durCourt(n)], ['Qui', n.marc ? 'Marc' : 'Claude'], ['Début', n.start ? dt(n.start) : '—'], ['Fin', n.st === 'done' ? dt(n.end) : '—'],
      );
    if (n.st === 'todo') f.push(['File', fileFact(n)]);
  } else {
    f.push(['Avancement', `${n.cnt.done}/${n.ls.length} faites`], ['Durée', durCourt(n)], ['Début', n.start ? dt(n.start) : '—'], ['Fin', n.end ? dt(n.end) : '—']);
    if (n.cumul) f.push(['Travail cumulé', dur(n.cumul)]);
