  if (!n.leaf && n.start != null) h += `<p class="txt vide sec">Durée = du début de sa première tâche à la fermeture de la dernière${n.fini ? '' : ' (jusqu\'au relevé tant qu\'une tâche reste ouverte)'}. Travail cumulé = la somme des durées de ses tâches.</p>`;
  if (n.res) h += txtSec(n.lvl === 'chantier' ? 'Objectif' : 'Résultat', n.res);
  if (n.fq) h += txtSec('Fini quand', n.fq);
  if (!n.leaf){
    h += `<div class="sec"><small>Avancement</small>${bar3(n.ce)}</div>`;
    h += `<div class="sec"><small>${n.lvl === 'app' ? 'Chantiers' : 'Contenu'}</small>${n.children.map(c => item(c)).join('') || '<p class="empty">Vide.</p>'}</div>`;
  } else {
    if (n.waits.length) h += `<div class="sec"><small>Dépend de</small>${n.waits.map(w => w.unknown ? `<a class="it" href="https://github.com/MoKarade/${esc(w.ref.split('#')[0])}/issues/${esc(w.ref.split('#')[1])}" target="_blank" rel="noopener"><span class="tt">${esc(w.ref)} (hors backlog)</span><em>↗</em></a>` : item(w)).join('')}</div>`;
    if (n.blocks.length) h += `<div class="sec"><small>Débloque</small>${n.blocks.map(b => item(b)).join('')}</div>`;
  }
  h += `<div class="links">`;
  if (n.lvl === 'app') h += `<a class="lnk" href="${esc(n.url)}" target="_blank" rel="noopener">Issues de ${esc(n.app)} sur GitHub <small>↗</small></a>`;
  else h += `<a class="lnk" href="${esc(n.url)}" target="_blank" rel="noopener">Issue ${esc(n.app)} #${n.n} <small>GitHub ↗</small></a>`;
  if (n.leaf && n.pr) h += `<a class="lnk sec2" href="${esc(n.pr.url)}" target="_blank" rel="noopener">PR #${n.pr.n} · ${n.pr.merged ? 'fusionnée' : n.pr.state === 'open' ? 'ouverte' : 'fermée'} <small>↗</small></a>`;
  return h + `</div>`;
}
/* ---------- la file du script : pourquoi une tâche est (ou n'est pas) la suivante ---------- */
const EXC = {'geste-marc': 'attend ton geste (étiquette qui:marc)', 'bloquee': 'prévue : dépend d\'autre chose (étiquette bloqué)', 'en-cours': 'déjà en cours', 'jules': 'prise par Jules',
  'preuve-attendue': 'sa preuve est attendue (elle n\'occupe pas le dépôt)', 'attend-inconnue': 'dépend d\'une tâche que le backlog ne connaît pas', 'attend-ouverte': 'dépend d\'une tâche encore ouverte',
  'pr-ouverte': 'une PR ouverte la cite', 'fini-quand-absent': 'sans « Fini quand » écrit', 'frein-quota': 'retenue par le frein de quota (quota Claude de la semaine)'};
const TIER = {1: 'preuve due', 2: 'prio:1', 3: 'sécurité', 4: 'même mission que la dernière', 5: 'même chantier que la dernière', 6: 'alternance entre missions', 7: 'le reste, par prio puis numéro'};
function fileFact(n){
  if (!M.PRO) return 'file du script indisponible';
  if (n.next) return 'suivante';
  if (n.q) return 'n° ' + n.q + (n.rs === 'libre' ? '' : ' · ' + (RS[n.rs] || ''));

  return n.horsCalcul ? 'hors calcul' : '—';
}
function fileHTML(n){
  if (!M.PRO) return `<div class="sec"><small>File du script</small><p class="txt vide">prochaines.json indisponible : ${esc(M.errPro || 'relevé en erreur')}. La page ne devine pas la file.</p></div>`;
  const pd = M.PD[n.rl]; if (!pd) return '';
  const d = pd.d, f = pd.rang[n.ref];
  let t;
  if (f){
    t = `<b>${n.next ? 'La suivante à lancer' : 'N° ' + f.rang + ' de la file'}</b> du dépôt (${esc(RS[d.statut] || d.statut)}). Raison : ${esc(f.raison || TIER[f.tier] || '—')}${f.tier ? ' (palier ' + f.tier + ' sur 7)' : ''}.`;
    if (!n.next && d.statut === 'occupe') t += ` Rien ne part tant que ${esc((d.occupe_par || []).map(o => o.ref + ' (' + o.motif + ')').join(', ') || 'le travail en cours')} n'est pas fini.`;
    else if (!n.next && d.statut === 'libre' && d.suivante) t += ` La suivante est ${esc(d.suivante)}.`;
    else if (!n.next && d.statut === 'incident') t += ' Un incident ouvert passe avant tout.';

  /* barres empilées, une case par heure ou par jour : sert aux fusions, à Vercel, à Jules, aux minutes Actions… */

  /* tâches acceptées, empilées par app, vers le plafond « toutes les tâches » */

  /* fusions par jour, empilées par app */

  /* tâches ouvertes : depuis quand, et où (l'état du moment, pas la période ; âge = depuis la création de la tâche) */

  /* quand le robot travaille : heure x jour de semaine */

  /* durée des tâches finies */
  function chDuree(W){

  }
  window.render = function(){
    ANIM = false;
    document.body.classList.add('anim');
    if (!M){ $('#mv').innerHTML = '<p class="empty" role="status">En attente du relevé…</p>'; return; }
    try { paint(); } catch (e) { $('#mv').textContent = 'Erreur d\'affichage : ' + e.message; console.error(e); }
    if (DET) renderDet();
    if (!$('#sheet').hidden && ST.stack.length){ const r = ST.stack[ST.stack.length - 1]; if (nodeOf(r)) openSheet(r, false); else closeSheet(); }
  };

  /* ---------- infobulles : survol, focus clavier, toucher (remplacent les title natifs) ---------- */
  const TIP = document.createElement('div'); TIP.id = 'mtip'; TIP.setAttribute('role', 'tooltip'); TIP.hidden = true; document.body.appendChild(TIP);
  let tipEl = null, tipTm = 0;
  const tipOf = el => {
    for (let e = el, i = 0; e && e !== document.body && i < 6; e = e.parentElement, i++){
      if (e.dataset && e.dataset.tip) return [e, e.dataset.tip];
      const t = e.getAttribute && e.getAttribute('title');
      if (t){ e.dataset.tip = t; e.removeAttribute('title'); return [e, t]; }
      const c = e.querySelector && e.querySelector(':scope > title');
      if (c){ e.dataset.tip = c.textContent; c.remove(); return [e, e.dataset.tip]; }
    }
    return null;
  };
  const tipPlace = (x, y) => {
    const r = TIP.getBoundingClientRect(); let L = x + 14, T = y + 16;
    if (L + r.width > innerWidth - 8) L = Math.max(8, x - r.width - 14);
    if (T + r.height > innerHeight - 8) T = Math.max(8, y - r.height - 14);
    TIP.style.left = L + 'px'; TIP.style.top = T + 'px';
  };
  const tipShow = (el, text, x, y) => { tipEl = el; TIP.textContent = text; TIP.hidden = false; tipPlace(x, y); };
  const tipHide = () => { TIP.hidden = true; tipEl = null; clearTimeout(tipTm); };
  document.addEventListener('pointerover', ev => { if (ev.pointerType === 'touch') return; const t = tipOf(ev.target); if (t) tipShow(t[0], t[1], ev.clientX, ev.clientY); else tipHide(); });
  document.addEventListener('pointermove', ev => { if (tipEl && !TIP.hidden && ev.pointerType !== 'touch'){ if (!tipEl.isConnected || !tipEl.contains(ev.target)) return tipHide(); tipPlace(ev.clientX, ev.clientY); } });
  document.addEventListener('pointerdown', ev => { if (ev.pointerType !== 'touch') return; const t = tipOf(ev.target); if (t){ tipShow(t[0], t[1], ev.clientX, ev.clientY - 40); clearTimeout(tipTm); tipTm = setTimeout(tipHide, 3500); } else tipHide(); });
  document.addEventListener('focusin', ev => { const t = tipOf(ev.target); if (t){ const r = t[0].getBoundingClientRect(); tipShow(t[0], t[1], r.left + r.width / 2, r.top - 8); } });
  document.addEventListener('focusout', tipHide); document.addEventListener('scroll', tipHide, true); document.addEventListener('keydown', ev => { if (ev.key === 'Escape') tipHide(); });
  window.render();
})();
</script>
