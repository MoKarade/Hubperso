# Vérifie que la CONSTELLATION est cohérente — pas qu'une app répond, mais que ce que le hub
# croit d'elle et ce qu'elle publie d'elle-même concordent.
#
# SÉPARÉ du gate, volontairement, et pour la même raison que le job `audit` : ce contrôle
# dépend de la disponibilité de CINQ apps. Mêlé au gate, un déploiement en cours ailleurs
# peindrait en rouge une PR qui n'y est pour rien — et on prendrait l'habitude du rouge.
name: Constellation

on:
  schedule:
    # Une fois par jour. Les incohérences visées (identité divergente, contrat trop récent,
    # périodes de coût mélangées) ne se réparent pas toutes seules et ne clignotent pas :
    # elles durent des semaines. Un run quotidien suffit, un run par heure ne dirait rien de plus.
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    name: Cohérence hub ↔ apps
    runs-on: [self-hosted, windows, atelier-pc]
    if: github.event.repository.private == true && (!startsWith(github.event_name, 'pull_request') || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    # Cinq apps derrière des réveils à froid, 9 s de budget chacune : large, mais borné.
    # Sans plafond le défaut GitHub est de SIX HEURES.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          # [CI-PERSIST-CREDS] `actions/checkout` v2+ écrit le GITHUB_TOKEN dans la config git du
          # runner POUR TOUT LE RESTE DU RUN : n'importe quelle étape suivante, y compris une
          # action tierce, peut le lire. Aucun workflow de ce dépôt ne fait de `git push` —
          # vérifié un par un — et `auto-merge.yml` passe par l'API avec `GH_TOKEN` en variable
          # d'environnement, que `gh` lit SANS toucher à la config git.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - shell: pwsh
        run: npm ci --ignore-scripts

      - name: Interroger les cinq apps et juger la cohérence
        env:
          HUB_TOKEN_FINANCEAI: ${{ secrets.HUB_TOKEN_FINANCEAI }}
          HUB_TOKEN_DRIVEAI: ${{ secrets.HUB_TOKEN_DRIVEAI }}
          HUB_TOKEN_BATCHCHEF: ${{ secrets.HUB_TOKEN_BATCHCHEF }}
          HUB_TOKEN_CARAI: ${{ secrets.HUB_TOKEN_CARAI }}
          HUB_TOKEN_JOBAI: ${{ secrets.HUB_TOKEN_JOBAI }}
        shell: pwsh
        run: npm run constellation
