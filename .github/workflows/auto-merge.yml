# Auto-merge : fusionner une PR dès qu'elle est VRAIMENT prête, et jamais avant.
#
# Décision de Marc, 21/08/2026 : auto-merge partout, le BROUILLON est le seul frein.
#
# ── TOUTE LA DÉCISION EST DANS scripts/autoMerge.mjs, QUI EST TESTÉ ─────────────────
#
# Ce fichier ne fait que récolter du JSON et obéir. C'est délibéré : un `if:` de workflow ne
# se teste pas, et le premier auto-merge du parc (DriveAI) portait sa logique dans du shell —
# deux défauts n'ont été trouvés qu'en production, dont un `gh pr ready` qui RETIRAIT le
# brouillon avant de merger. L'ADR-0045, ouverte en brouillon avec « statut Proposé, demande
# ta ratification », a été fusionnée 63 secondes après sa création.
#
# ⚠️ IL N'Y A PAS DE `gh pr ready` ICI, ET IL NE DOIT JAMAIS Y EN AVOIR.
#
# ── POURQUOI `workflow_run` ET PAS `pull_request` ───────────────────────────────────
#
# `workflow_run` s'exécute depuis la branche PAR DÉFAUT : le workflow et le script sont lus
# depuis `main`, jamais depuis la branche de la PR. Une PR ne peut donc pas modifier les
# règles qui décident de son propre merge. Corollaire : ce fichier n'agit qu'une fois mergé.
#
# Second déclencheur `pull_request: [ready_for_review]` : une PR sortie du brouillon APRÈS
# que sa CI soit passée ne verrait sinon plus jamais d'événement, et resterait ouverte alors
# que tout est vert. Sans lui, le frein « brouillon » deviendrait un piège.

name: Auto-merge

on:
  workflow_run:
    types: [completed]
    workflows: ["*"]
  pull_request_target:
    types: [ready_for_review]
  # ── LE RETOUR DE VERCEL ─────────────────────────────────────────────────────────────
  #
  # Vercel publie un STATUT de commit, pas un workflow : sa fin ne déclenche aucun
  # `workflow_run`. Une PR dont la CI finit AVANT le déploiement de prévisualisation
  # (« pas de merge : Vercel en cours ») n'avait plus que la passe planifiée — et GitHub
  # espace en réalité ce cron « toutes les 30 min » de 4 à 5 h (mesuré le 23/09/2026 sur
  # CarAI : 00:46, 05:22, 10:10, 15:07, 19:07 Z ; #138 à #140 vertes, restées ouvertes).
  # `status` réveille l'examen dès qu'un statut passe au vert (filtré dans le `if:`).
  status:
  # ── LA PASSE DE RATTRAPAGE, ET C'EST ELLE QUI REND L'ENSEMBLE FIABLE ───────────────
  #
  # `workflow_run` NE SE REJOUE JAMAIS. Un appel d'API bloqué par la limite de débit GitHub,
  # un webhook perdu, et la PR reste ouverte EN SILENCE avec une CI verte — vécu sur DriveAI
  # le 17/08, et vécu par moi-même toute la journée du 21/08 sur mes propres écritures.
  #
  # Elle rattrape aussi le RETOUR DU QUOTA VERCEL : une PR bloquée hier parce que le plafond
  # du compte était atteint repart d'elle-même le lendemain, sans que personne n'y touche.
  #
  # UNE FOIS PAR JOUR (décision de Marc, 23/09/2026). Le « */30 » d'avant n'a jamais existé :
  # GitHub l'espaçait de 4 à 5 h (mesuré sur CarAI), et chaque passage coûte au moins une minute
  # d'Actions sur un dépôt privé — 2 000 min/mois en tout, épuisées le 23/09, auto-merge = 26 %
  # de la consommation. Le réveil principal est événementiel : `workflow_run` (fin de CI) et
  # `status` (fin du déploiement Vercel). Ceci n'est plus qu'un filet quotidien (05:23 à Québec).
  schedule:
    - cron: "23 9 * * *"
  # Pour pouvoir la déclencher à la main quand on veut débloquer tout de suite.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # ⚠️ INDISPENSABLES, et absentes au premier run (21/08). Sans elles, la lecture de
  # `statusCheckRollup` échoue avec « Resource not accessible by integration » — un message
  # qui ne nomme ni la permission ni le champ fautif, et qui ressemble à une panne d'API.
  #
  # `checks: read`   → les checks des GitHub Apps (Actions, Vercel).
  # `statuses: read` → les statuts « legacy » (commit statuses), que Vercel utilise aussi.
  # `actions: read`  → `checkSuite.workflowRun`, que `gh pr view --json statusCheckRollup`
  #                    demande. Ce champ relève de l'API Actions, PAS de `checks`.
  #
  # Le workflow a échoué FERMÉ ce jour-là : cinq essais, puis refus de merger. C'est le
  # comportement voulu — mais il aurait pu tourner des jours sans que personne ne comprenne
  # pourquoi rien ne se fusionnait, puisque « pas de merge » ne réveille personne.
  #
  # ⚠️⚠️ ET C'EST EXACTEMENT CE QUI S'EST PASSÉ LE 14/09, `actions: read` EN MOINS.
  # Mesuré sur CE dépôt : les runs 361, 362, 363 et 364 d'« Auto-merge » ont tous échoué
  # entre 18h53 et 19h42 Z — passes planifiées et `pull_request_target` comprises — sur la
  # même erreur, au même chemin GraphQL :
  #   Resource not accessible by integration
  #   (repository.pullRequest.statusCheckRollup.nodes.0.commit
  #    .statusCheckRollup.contexts.nodes.0.checkSuite.workflowRun)
  # Cinq essais, échec fermé, aucune PR fusionnée — et RIEN de rouge là où quelqu'un
  # regarde : le seul signal est un run d'Actions en échec, que personne n'ouvre. Les cinq
  # PR du lot 3 ont dû être fusionnées à la main sans que personne sache pourquoi
  # l'automatisation se taisait.
  #
  # ⚠️ Le message d'erreur du script, lui, accuse encore « checks: read, statuses: read » —
  # les permissions du PREMIER incident. Il est donc faux depuis celui-ci, et il envoie
  # vérifier deux permissions déjà présentes. Corrigé plus bas, dans le même commit.
  #
  # La leçon du 21/08 se répète mot pour mot, un champ plus loin : une permission manquante
  # ne se manifeste JAMAIS par « il manque une permission ». La liste est désormais
  # VERROUILLÉE par `tests/autoMerge.test.ts` — une permission retirée fait rougir le gate
  # au lieu d'arrêter les merges en silence.
  #
  # Diagnostic et correctif d'origine : CarAI #108, trouvé par une autre session le même
  # jour. Porté ici avec les mesures de CE dépôt, pas les siennes.
  actions: read
  checks: read
  statuses: read

# Une PR à la fois : deux workflows qui finissent en même temps déclencheraient deux runs
# concurrents sur la même PR, et le second échouerait sur une PR déjà fermée.
concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  fusionner:
    # Le `workflow_run` doit venir d'une PR du dépôt LUI-MÊME. Le préfixe de branche est une
    # convention, jamais une preuve d'origine : pour une PR de fork, la branche est choisie
    # par son auteur. La décision revérifie `isCrossRepository` de toute façon — défense en
    # profondeur, la même promesse codée à deux endroits.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'status' && github.event.state == 'success') ||
      github.event_name == 'pull_request_target' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # SORTIE IMMÉDIATE (étape 2, coût) : sans PR ouverte il n'y a rien à examiner — on ne paie
      # ni checkout ni Node. Un échec de cette lecture NE sort PAS : on continue, par prudence.
      - name: Y a-t-il une PR ouverte ?
        id: ouvertes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          n="$(gh pr list --repo "$REPO" --state open --limit 1 --json number --jq 'length' 2>/dev/null || echo inconnu)"
          echo "nombre=$n" >> "$GITHUB_OUTPUT"
          [ "$n" = "0" ] && echo "Aucune PR ouverte : sortie immédiate."
          exit 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.ouvertes.outputs.nombre != '0'
        with:
          # [CI-PERSIST-CREDS] `actions/checkout` v2+ écrit le GITHUB_TOKEN dans la config git du
          # runner POUR TOUT LE RESTE DU RUN : n'importe quelle étape suivante, y compris une
          # action tierce, peut le lire. Aucun workflow de ce dépôt ne fait de `git push` —
          # vérifié un par un — et `auto-merge.yml` passe par l'API avec `GH_TOKEN` en variable
          # d'environnement, que `gh` lit SANS toucher à la config git.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.ouvertes.outputs.nombre != '0'
        with:
          node-version: "24"

      - name: Décider, puis fusionner
        if: steps.ouvertes.outputs.nombre != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCHE: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
        run: |
          set -uo pipefail

          # Tout appel à l'API se rejoue. Incident DriveAI du 2026-08-17 : un 503 TRANSITOIRE
          # sur une simple LECTURE a tué le run avant le merge — et comme `workflow_run` ne se
          # rejoue pas, la PR est restée ouverte EN SILENCE, CI verte.
          avec_retry() {
            local delai=2
            for essai in 1 2 3 4 5; do
              if "$@"; then return 0; fi
              echo "raté (essai $essai/5) — nouvel essai dans ${delai}s." >&2
              sleep "$delai"; delai=$((delai * 2))
            done
            return 1
          }

          # Sur événement : LA PR de la branche concernée. Sur passe planifiée : TOUTES les
          # PR ouvertes, puisqu'on cherche justement celles qu'un événement a manquées.
          if [ -n "$BRANCHE" ]; then
            numeros="$(avec_retry gh pr list --repo "$REPO" --head "$BRANCHE" --state open \
              --json number --jq '.[].number')" || {
                echo "::error::Impossible de lister les PR après 5 essais — on ne merge pas à l'aveugle."
                exit 1
              }
          else
            numeros="$(avec_retry gh pr list --repo "$REPO" --state open --limit 50 \
              --json number --jq '.[].number')" || {
                echo "::error::Impossible de lister les PR après 5 essais — on ne merge pas à l'aveugle."
                exit 1
              }
          fi

          if [ -z "$numeros" ]; then
            echo "Aucune PR ouverte à examiner."
            exit 0
          fi

          for numero in $numeros; do
          # `statusCheckRollup` porte TOUS les checks de la PR, tous workflows confondus, plus
          # les statuts « legacy » (Vercel). C'est ce qui remplace le « succès du workflow CI »
          # du premier auto-merge, qui ignorait les autres workflows du dépôt.
          etat="$(avec_retry gh pr view "$numero" --repo "$REPO" \
            --json isDraft,isCrossRepository,labels,mergeStateStatus,state,statusCheckRollup)" || {
              echo "::error::Impossible de lire la PR #$numero après 5 essais — on ne merge pas."
              echo "::error::Si le message parle de « Resource not accessible by integration », il MANQUE une permission au workflow — ce n'est pas une panne d'API. Le CHEMIN GraphQL cité dans l'erreur nomme le champ fautif : ...checkSuite.workflowRun ⇒ actions: read ; ...checkSuite/checkRuns ⇒ checks: read ; ...status/contexts ⇒ statuses: read."
              exit 1
            }

          verdict="$(echo "$etat" | node -e '
            const lu = require("fs").readFileSync(0, "utf8");
            import("./scripts/autoMerge.mjs").then(({ decision }) => {
              const pr = JSON.parse(lu);
              console.log(JSON.stringify(decision({ ...pr, checks: pr.statusCheckRollup })));
            });
          ')" || { echo "::error::Décision illisible — on ne merge pas."; exit 1; }

          merger="$(echo "$verdict" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).merger')"
          raison="$(echo "$verdict" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).raison')"

          # Code de raison (liste fermée, `CODES_RAISON` de scripts/autoMerge.mjs), en sortie du job.
          code="$(echo "$verdict" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).code')"
          echo "code_pr_$numero=$code" >> "$GITHUB_OUTPUT"

          if [ "$merger" != "true" ]; then
            echo "PR #$numero — pas de merge [$code] : $raison"
            continue
          fi

          echo "PR #$numero — merge : $raison"

          # Un essai raté peut avoir RÉUSSI côté serveur (réponse perdue) : on juge par l'ÉTAT
          # réel de la PR, jamais par le seul code de sortie.
          fusionnee=false
          for essai in 1 2 3 4 5; do
            if gh pr merge "$numero" --repo "$REPO" --squash --delete-branch; then fusionnee=true; break; fi
            if [ "$(gh pr view "$numero" --repo "$REPO" --json state --jq .state 2>/dev/null)" = "MERGED" ]; then
              echo "PR #$numero déjà mergée (l'essai précédent avait abouti côté serveur)."
              fusionnee=true; break
            fi
            sleep $((2 ** essai))
          done

          # Un merge raté se SIGNALE, mais n'arrête pas l'examen des autres PR : sur une passe
          # planifiée, une PR en conflit ne doit pas empêcher les suivantes de partir.
          if [ "$fusionnee" != "true" ]; then
            echo "::warning::Merge de la PR #$numero impossible après 5 essais."
          fi
          done
