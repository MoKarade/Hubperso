name: CI

# Ce dépôt n'avait AUCUNE vérification automatisée. C'est ce silence qui a laissé vivre
# en production 5 vulnérabilités — dont 2 CRITICAL sur `@auth/core`, l'une étant un
# contournement de la normalisation d'adresse par homoglyphes, soit le vecteur exact
# contre un hub dont toute l'auth repose sur une COMPARAISON D'ADRESSES — celle du
# propriétaire (`AUTHORIZED_EMAIL`) comme celles de la base, que `normaliser()` se contente
# de passer en minuscules et de trimmer. L'arrivée de la base n'a pas réduit ce vecteur :
# elle l'a élargi à toutes les personnes invitées.
# Rien ne s'est déclenché : il n'y avait rien pour se déclencher.
#
# Le job `gate` rejoue EXACTEMENT le gate local du CLAUDE.md. Une CI qui vérifie autre
# chose que ce qu'on exécute avant de committer diverge, et c'est le mauvais exemplaire
# qu'on finit par croire.
on:
  push:
    branches: [main]
  pull_request:
  # Le cron ne sert qu'au job `audit` (voir plus bas) : une vulnérabilité apparaît sans
  # qu'une ligne de code n'ait changé. Lundi 12 h UTC.
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

# Une seule exécution utile par référence : un push qui en suit un autre annule le premier.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # Plafond : sans lui, un job fige tourne SIX HEURES avant d'echouer (vecu sur
    # DriveAI le 19/08/2026). Calibre sur la duree reelle — 1 min 36 s observe.
    timeout-minutes: 15
    name: Gate (typecheck · tests · lint · build)
    # Le cron ne concerne que l'audit : inutile de rejouer le gate sur un code inchangé.
    if: github.event_name != 'schedule'
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","pc-marc"]') }} # dépôt public : machines GitHub (gratuites) ; privé : robot du PC
    steps:
      - uses: actions/checkout@v7
        with:
          # [CI-PERSIST-CREDS] `actions/checkout` v2+ écrit le GITHUB_TOKEN dans la config git du
          # runner POUR TOUT LE RESTE DU RUN : n'importe quelle étape suivante, y compris une
          # action tierce, peut le lire. Aucun workflow de ce dépôt ne fait de `git push` —
          # vérifié un par un ; la fusion automatique (Mergify, .mergify.yml) ne passe par aucun
          # workflow, donc par aucun jeton du runner.
          persist-credentials: false

      # La convention de compte-rendu est une COPIE synchronisée de
      # claude-config/conventions/COMPTE-RENDU.md — un CLAUDE.md ne charge rien hors de son
      # arbre, donc le renvoi seul ne chargerait rien. Une copie sans contrôle redevient une
      # variante locale en silence : c'est le mode de panne que ce pas rend bruyant.
      # Pour la faire évoluer : modifier la SOURCE, propager, mettre à jour cette empreinte.
      - name: La convention de compte-rendu n'a pas dérivé
        run: echo "97e36acba8770c9614b6295773267b9690d07bc5bcd130b3bc0d03da996ab62b  docs/COMPTE-RENDU.md" | sha256sum -c -

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` et non `npm install` : le lockfile est committé et fait autorité.
      # [CI-IGNORE-SCRIPTS] Et `--ignore-scripts` : un script d'installation de paquet
      # s'exécute avec les droits du runner, qui porte les secrets du workflow. MESURÉ sur ce
      # dépôt avant d'être posé (le piège est réel ailleurs — Playwright, esbuild) :
      # `npm ci --ignore-scripts` puis typecheck, build et 413 tests, tous verts. PGlite
      # embarque son WASM dans le paquet, il n'a aucun script d'installation.
      - name: Dépendances
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Lint
        run: npm run lint

      # Le build en dernier : l'étape la plus lente, et un échec de typecheck ou de test
      # la rend inutile. Vérifié : il ne demande AUCUNE variable d'environnement.
      - name: Build
        run: npm run build

  audit:
    # Plafond : sans lui, un job fige tourne SIX HEURES avant d'echouer (vecu sur
    # DriveAI le 19/08/2026). Calibre sur la duree reelle — 29 s observe.
    timeout-minutes: 10
    name: Audit des dépendances de production
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","pc-marc"]') }} # dépôt public : machines GitHub (gratuites) ; privé : robot du PC
    # Job SÉPARÉ du gate, volontairement. Un avis de sécurité est publié sans qu'aucun
    # commit n'ait eu lieu : si l'audit vivait dans le gate, un dépôt sain deviendrait
    # « rouge » du jour au lendemain et on prendrait l'habitude du rouge — c'est
    # exactement comme ça qu'une CI cesse d'être lue (vécu chez JobAI : quatre commits
    # rouges de suite sans que personne ne le voie). Séparés, « gate vert / audit rouge »
    # se lit d'un coup d'œil et désigne la vraie cause.
    steps:
      - uses: actions/checkout@v7
        with:
          # [CI-PERSIST-CREDS] `actions/checkout` v2+ écrit le GITHUB_TOKEN dans la config git du
          # runner POUR TOUT LE RESTE DU RUN : n'importe quelle étape suivante, y compris une
          # action tierce, peut le lire. Aucun workflow de ce dépôt ne fait de `git push` —
          # vérifié un par un ; la fusion automatique (Mergify, .mergify.yml) ne passe par aucun
          # workflow, donc par aucun jeton du runner.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dépendances
        run: npm ci --ignore-scripts

      # `--omit=dev` : seules les dépendances qui partent en production comptent. Les
      # avis sur l'outillage de développement ne menacent pas le site et noieraient le
      # signal. Mesuré à 0 au moment où ce fichier est écrit.
      - name: npm audit (production)
        run: npm audit --omit=dev

  # ---------------------------------------------------------------------------------------
  # Portes qualité de l'Atelier (S6, 23/09/2026) — même dispositif que le pilote BatchChef.
  # Depuis la fusion automatique, une PR verte part en production sans relecture humaine :
  # ces deux jobs sont ce qui garantit qu'elle ne fait RECULER ni la qualité ni la sécurité.
  # Cliquet : qualite/seuils.json fige l'état au jour de la mise en place ; rien ne recule.
  qualite:
    timeout-minutes: 20
    name: Qualité (lint · couverture · code mort · architecture)
    # Le cron ne concerne que l'audit : inutile de rejouer ce job sur un code inchangé.
    if: github.event_name != 'schedule'
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","pc-marc"]') }} # dépôt public : machines GitHub (gratuites) ; privé : robot du PC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Dépendances
        run: npm ci --ignore-scripts
      - name: Portes qualité (cliquet)
        run: node qualite/portes.mjs
      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-qualite
          path: qualite/rapport.json
          if-no-files-found: ignore

  securite:
    # Secrets dans tout l'historique qui serait fusionné — main + la PR, via HEAD (gitleaks) — + analyse
    # statique du code (Semgrep). Les autres branches relèvent de l'audit, pas de la porte : sans
    # --log-opts, gitleaks lirait `--all` et une vieille branche ferait rougir une PR qui n'y touche pas.
    # Mesuré le 23/09/2026 : gitleaks 0 fuite sur l'historique (104 commits) ; Semgrep 0 résultat sur le code
    # (.github exclu). Donc bloquant d'emblée (--error).
    timeout-minutes: 10
    name: Sécurité (secrets · analyse statique)
    # Le cron ne concerne que l'audit : inutile de rejouer ce job sur un code inchangé.
    if: github.event_name != 'schedule'
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","pc-marc"]') }} # dépôt public : machines GitHub (gratuites) ; privé : robot du PC
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks lit l'historique complet, pas seulement le dernier commit
          persist-credentials: false
      # Binaire officiel, version et empreinte figées : un outil de sécurité téléchargé sans
      # vérification serait lui-même une surface d'attaque.
      - name: Secrets (gitleaks, historique complet)
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --no-banner --redact --log-opts="--full-history HEAD"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Analyse statique (Semgrep)
        run: |
          # --only-binary : aucune compilation ni script d'installation, seulement des roues publiées.
          python -m pip install --quiet --only-binary :all: semgrep==1.177.0
          semgrep scan --metrics off --error --exclude .github \
            --config p/typescript --config p/react --config p/nextjs \
            --config p/secrets --config p/owasp-top-ten .

# ── Note sur le cron ──────────────────────────────────────────────────────────
# GitHub désactive les workflows planifiés d'un dépôt resté 60 jours sans activité, et
# le signale par courriel. Si l'audit hebdomadaire cesse d'apparaître, c'est là qu'il
# faut regarder — pas dans ce fichier.
