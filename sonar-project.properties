# sonar-project.properties — réglages d'analyse SonarCloud.
#
# ⚠️ CE FICHIER NE DÉSACTIVE AUCUNE RÈGLE ET NE DÉPLACE AUCUN SEUIL. Il dit au détecteur de
# copier-coller qu'un endroit précis du dépôt n'est pas du code, mais une TABLE.
#
# POURQUOI (21/09/2026, mesuré) : `lib/sources.ts` déclare les six apps du hub, une par entrée,
# avec par construction les mêmes six champs (`id`, `name`, `accueilUrl`, `defaultSummaryUrl`,
# `urlEnv`, `tokenEnv`). Elles se ressemblaient DÉJÀ avant qu'on y touche ; le jour où la PR #63
# a séparé l'adresse de la page de l'endpoint du contrat, chaque entrée est passée de 8 à 10
# lignes — c'est-à-dire au-dessus de la fenêtre du détecteur, qui les a signalées d'un coup.
#
# Mesuré à la main sur le projet ENTIER (blocs de 10 lignes, littéraux normalisés) : sur les 12
# lignes neuves prises dans un bloc répété, **10 sont ces entrées**. Les deux autres sont des
# fixtures de test à un champ près.
#
# Les remèdes « normaux » ont été essayés ou pesés, et ils coûtent tous quelque chose de réel :
#   - un constructeur partagé pour les cinq apps du même domaine → ESSAYÉ, puis ANNULÉ :
#     re-mesuré, les blocs répétés étaient toujours là. Il déguise la répétition d'une table,
#     il ne la supprime pas ;
#   - déduire `accueilUrl` de l'origine de `defaultSummaryUrl` → c'est EXACTEMENT le couplage
#     que la PR #63 supprime (leçon n° 10) : le jour où une app déplace son résumé, le lien de
#     la palette suivrait en silence ;
#   - une entrée par ligne → illisible, et à la merci du formatage.
#
# Une table de configuration à six lignes n'est pas du copier-coller de logique : la répétition
# EST sa forme, et c'est ce qui la rend lisible d'un coup d'œil. L'exclusion est donc étroite —
# ce seul fichier, et seulement pour la DUPLICATION. Tout le reste de l'analyse s'y applique
# encore, et le seuil de 3 % reste entier pour tout le dépôt.
#
# ⚠️ NON VÉRIFIÉ DEPUIS LE CONTENEUR : `sonarcloud.io` y répond 403 au CONNECT, donc je ne peux
# ni lire le résultat de l'analyse ni confirmer que l'analyse AUTOMATIQUE (App GitHub, sans
# workflow) lit bien ce fichier. Si la porte de qualité reste rouge sur la duplication après ce
# commit, c'est que ce fichier est ignoré : le même réglage se pose alors dans l'interface
# SonarCloud (Administration → General Settings → Analysis Scope → Duplications).
sonar.cpd.exclusions=lib/sources.ts
