# Fusion automatique (Mergify, plan gratuit) — 15/10/2026.
# Une PR prête (pas brouillon, sans l'étiquette « hold ») entre dans la file,
# est remise à jour sur la tête de main, retestée par le robot du PC, puis fusionnée en squash.
# Fichiers sensibles (ceux du CODEOWNERS : .github, hooks, qualite, vercel.json, drizzle, .env) : jamais de fusion automatique, Marc fusionne.
# Une PR à la fois : pas de regroupement. Étiquette « hold » sur une PR = elle ne fusionne pas.
queue_rules:
  - name: default
    merge_method: squash
    batch_size: 1
    queue_conditions:
      - base = main
      - -draft
      - label != hold
      # Chemins protégés : Marc fusionne. SEULE exception (oui de Marc du 15/10/2026, MoKarade/.github#26) :
      # montée mineure ou corrective des actions, ouverte par Dependabot, rien hors de .github/,
      # aucun commit d'un autre auteur que Dependabot ou Mergify. Les majeures restent à Marc.
      - or:
          - -files~=^(\.github/|scripts/hooks/|qualite/|vercel\.json|drizzle/|\.env|\.mergify\.yml)
          - and:
              - 'author = dependabot[bot]'
              - 'head ~= ^dependabot/github_actions/'
              - '-files ~= ^(?!\.github/)'
              - 'dependabot-update-type ~= ^version-update:semver-(minor|patch)$'
              - '-dependabot-update-type = version-update:semver-major'
              - '-commits[*].author ~= ^(?!(dependabot\[bot\]|mergify\[bot\])$)'
      - check-success = Gate (typecheck · tests · lint · build)
      - check-success = Qualité (lint · couverture · code mort · architecture)
      - check-success = Sécurité (secrets · analyse statique)
      - check-success = La doc suit le code
    merge_conditions:
      - label != hold
      # Chemins protégés : Marc fusionne. SEULE exception (oui de Marc du 15/10/2026, MoKarade/.github#26) :
      # montée mineure ou corrective des actions, ouverte par Dependabot, rien hors de .github/,
      # aucun commit d'un autre auteur que Dependabot ou Mergify. Les majeures restent à Marc.
      - or:
          - -files~=^(\.github/|scripts/hooks/|qualite/|vercel\.json|drizzle/|\.env|\.mergify\.yml)
          - and:
              - 'author = dependabot[bot]'
              - 'head ~= ^dependabot/github_actions/'
              - '-files ~= ^(?!\.github/)'
              - 'dependabot-update-type ~= ^version-update:semver-(minor|patch)$'
              - '-dependabot-update-type = version-update:semver-major'
              - '-commits[*].author ~= ^(?!(dependabot\[bot\]|mergify\[bot\])$)'
      - check-success = Gate (typecheck · tests · lint · build)
      - check-success = Qualité (lint · couverture · code mort · architecture)
      - check-success = Sécurité (secrets · analyse statique)
      - check-success = La doc suit le code

merge_protections_settings:
  auto_merge_conditions:
    - base = main
    - -draft
    - label != hold
    # Chemins protégés : Marc fusionne. SEULE exception (oui de Marc du 15/10/2026, MoKarade/.github#26) :
    # montée mineure ou corrective des actions, ouverte par Dependabot, rien hors de .github/,
    # aucun commit d'un autre auteur que Dependabot ou Mergify. Les majeures restent à Marc.
    - or:
        - -files~=^(\.github/|scripts/hooks/|qualite/|vercel\.json|drizzle/|\.env|\.mergify\.yml)
        - and:
            - 'author = dependabot[bot]'
