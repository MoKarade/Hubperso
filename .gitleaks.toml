# Configuration gitleaks (lue automatiquement à la racine du dépôt : gitleaks cherche
# `.gitleaks.toml` dans le dossier scanné quand ni --config ni GITLEAKS_CONFIG ne sont donnés).
title = "Hubperso"

[extend]
# Toutes les règles par défaut restent actives.
useDefault = true

# Allowlist CIBLÉE : un résultat n'est ignoré que s'il remplit LES DEUX conditions
# (condition = "AND") : il est dans un fichier de tests/ ET sa valeur est une fixture de test
# explicite (« secret-de-test-… », « jeton-de-test-… »). Un vrai secret committé dans tests/ est
# toujours signalé ; une fixture de ce nom hors tests/ aussi.
[[allowlists]]
description = "Fixtures de test explicites (secret-de-test-*, jeton-de-test-*) dans tests/"
condition = "AND"
paths = ['''^tests/.*\.(ts|tsx)$''']
regexTarget = "match"
regexes = ['''(?i)["'](secret|jeton|token)-de-test[a-z0-9-]*["']''']

# Bibliothèques tierces minifiées auto-hébergées (public/vendor/LISEZMOI.md) : un nom de méthode
# (`key:"…"`) y ressemble à une clé d'API (generic-api-key, entropie 3,9). Ce n'est pas un secret :
# chaque copie est identique octet pour octet à celle d'unpkg ou du paquet npm (empreintes verrouillées par
# tests/grapheHtml.test.ts et tests/grapheVue3d.test.ts). Allowlist limitée à CES fichiers ET à CETTE règle : toute autre règle
# (clé AWS, jeton GitHub…) reste active sur lui, et ce chemin n'ouvre rien ailleurs.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "vis-network 9.1.6 et 3d-force-graph 1.80.1 minifiés : faux positif generic-api-key"
paths = ['''^public/vendor/(vis-network-9\.1\.6|3d-force-graph-1\.80\.1)\.min\.js$''']
